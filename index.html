/* ---- PDF: Temporary Electrical Connection requisition ----
   Mirrors the official NTPC-Unchahar "Requisition of Temporary Electrical
   Connection" paper form: letterhead block, centered underlined title,
   To/Date block, Sub line, a bordered details table, a Declaration
   checkbox + 4 numbered clauses, applicant/forwarding signature block,
   and the plant address footer. */
/* ============================================================
   SHARED PDF LETTERHEAD + FOOTER
   Matches the Temporary Electrical Connection PDF exactly.
   Applied to every page of every checklist PDF.
   ============================================================ */
function drawPdfHeaderFooter(doc){
  const pageW=doc.internal.pageSize.getWidth(), pageH=doc.internal.pageSize.getHeight();
  const marginL=50, marginR=50;
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(0);
  doc.text('NTPC Limited',marginL,42);
  doc.setFont('helvetica','italic'); doc.setFontSize(8);
  doc.text('(A Govt. of India Enterprise)',marginL,54);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text('Unchahar',pageW-marginR,46,{align:'right'});
  doc.setLineWidth(0.75); doc.line(marginL,64,pageW-marginR,64);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(90);
  const footerLines=[
    'Feroz Gandhi Unchahar Thermal Power Project, Unchahar, Distt. – Raebareli, U.P.-229406',
    'Registered Office: NTPC Bhawan, SCOPE Complex, 7 Institutional Area, Lodhi Road, New Delhi - 110003'
  ];
  let fy=pageH-38; footerLines.forEach(line=>{doc.text(line,pageW/2,fy,{align:'center'});fy+=11;});
  doc.setTextColor(0);
}
function applyPdfLetterheadFooter(doc){
  const pageCount=doc.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){doc.setPage(i);drawPdfHeaderFooter(doc);}
  doc.setPage(pageCount);
}

function generateTempConnectionPdf(req){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  const marginL = 50, marginR = 50;
  const usableW = pageW - marginL - marginR;
  // ---- Shared NTPC letterhead ----
  drawPdfHeaderFooter(doc);
  let y = 88;

  // ---- Title ----
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  const title = 'REQUISITION OF TEMPORARY ELECTRICAL CONNECTION';
  const tw = doc.getTextWidth(title);
  doc.text(title, pageW/2, y, {align:'center'});
  doc.line(pageW/2-tw/2, y+3, pageW/2+tw/2, y+3);
  y += 30;

  // ---- To / Date ----
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text('To,', marginL, y); y += 15;
  doc.setFont('helvetica','bold');
  doc.text('SR MANAGER/MANAGER', marginL, y); y += 15;
  doc.text('EMD,', marginL, y); y += 15;
  doc.text('NTPC- Unchahar.', marginL, y);
  doc.setFont('helvetica','normal');
  doc.text('Date: ' + fmtDate(req.submittedAt), pageW-marginR, y, {align:'right'});
  y += 24;

  doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
  doc.text('Sub: Requisition for Temporary Electrical Connection', marginL, y);
  doc.setLineWidth(0.5);
  doc.line(marginL, y+3, marginL+doc.getTextWidth('Sub: Requisition for Temporary Electrical Connection'), y+3);
  y += 20;

  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text('Please arrange temporary connection as per as per details below', marginL, y);
  y += 16;

  // ---- Details table (label column | value column) ----
  const labelColW = usableW * 0.42;
  const valueColW = usableW - labelColW;
  const rowsData = [
    ['Area/ Location where connection is\nrequired', req.location || '—'],
    ['Type of supply', req.supplyType || '—'],
    ['Purpose of which the supply is be\ngiven', (req.purposes||[]).join(', ') + (req.purposeOther ? ' ('+req.purposeOther+')' : '') || '—'],
    ['Please specify requirement\n(No. of light fittings/Pump HP/Amps)', req.requirement || '—'],
    ['Time period', fmtDate(req.periodFrom) + '   to   ' + fmtDate(req.periodTo)]
  ];
  const padX = 8, padY = 9, lineH = 12;
  doc.setFontSize(9.5);
  const rowHeights = rowsData.map(([label,val])=>{
    doc.setFont('helvetica','normal');
    const labelLines = doc.splitTextToSize(label, labelColW-2*padX);
    const valueLines = doc.splitTextToSize(String(val), valueColW-2*padX);
    return Math.max(labelLines.length, valueLines.length, 1)*lineH + 2*padY;
  });
  const tableTop = y;
  const tableBottom = tableTop + rowHeights.reduce((a,b)=>a+b,0);
  doc.setLineWidth(0.75);
  doc.rect(marginL, tableTop, usableW, tableBottom-tableTop);
  doc.line(marginL+labelColW, tableTop, marginL+labelColW, tableBottom);
  let ry = tableTop;
  rowsData.forEach(([label,val], idx)=>{
    const h = rowHeights[idx];
    if(idx>0) doc.line(marginL, ry, marginL+usableW, ry);
    doc.setFont('helvetica','normal');
    const labelLines = doc.splitTextToSize(label, labelColW-2*padX);
    const valueLines = doc.splitTextToSize(String(val), valueColW-2*padX);
    doc.text(labelLines, marginL+padX, ry+padY+9);
    doc.text(valueLines, marginL+labelColW+padX, ry+padY+9);
    ry += h;
  });
  y = tableBottom + 22;

  // ---- Declaration heading + checkbox ----
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
  doc.text('Declaration:', marginL, y);
  const chkSize = 12, chkX = pageW-marginR-chkSize, chkY = y-chkSize+2;
  doc.setLineWidth(0.75);
  doc.rect(chkX, chkY, chkSize, chkSize);
  if(req.declared){
    doc.setLineWidth(1.1);
    doc.line(chkX+2, chkY+6, chkX+5, chkY+chkSize-2);
    doc.line(chkX+5, chkY+chkSize-2, chkX+chkSize-2, chkY+2);
  }
  y += 16;

  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  const declClauses = [
    'I/We will ensure that there will be no unauthorized addition/alteration to & from temporary supply by the applicant/representative, which may increase the load on the supply or may develop unsafe condition due to loose connection or insulation damage to supply wires.',
    'I/We will ensure that connected equipment e.g. welding machine/pump etc. are in healthy condition and properly earthed.',
    'I/We will undertake to abide by the electrical safety rules and shall ensure safe working on temporary electrical connection.',
    'I/We will inform you to disconnect the connection immediately after completion of work and not leave the connection unattended.'
  ];
  declClauses.forEach((c,i)=>{
    const num = (i+1)+'.';
    const wrapped = doc.splitTextToSize(c, usableW-18);
    doc.text(num, marginL, y);
    doc.text(wrapped, marginL+16, y);
    y += wrapped.length*11.5 + 4;
  });
  y += 22;

  // ---- Applicant / Forwarding officer block ----
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  const col2X = marginL + usableW*0.55;
  doc.text('Name of Applicant: ' + (req.applicantName||'—'), marginL, y);
  doc.text('Forwarding Officer/ HOD Name', col2X, y);
  y += 20;
  doc.text('Department: ' + (req.department||'—'), marginL, y);
  doc.text(req.forwarding||'—', col2X, y);
  y += 20;
  doc.text('Designation: ' + (req.designation||'—') + '   Emp. NO.: ' + (req.empNo||'—'), marginL, y);
  y += 24;

  // ---- Status / decision block (kept as an addition beyond the paper form,
  // so the PDF still reflects the workflow status when re-downloaded) ----
  if(req.status && req.status!=='Pending'){
    doc.setDrawColor(200); doc.setLineWidth(0.5);
    doc.line(marginL, y, marginL+usableW, y);
    y += 16;
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
    doc.text('Status: ' + req.status, marginL, y); y += 14;
    doc.setFont('helvetica','normal');
    if(req.status==='Issued' || req.status==='Closed'){
      doc.text(`SL No.: ${req.slNo||'—'}    Technician: ${req.technicianName||'—'}    Connection Date: ${fmtDate(req.connectionDate)}`, marginL, y);
    } else if(req.status==='Rejected' && req.rejectReason){
      doc.text('Reason: ' + req.rejectReason, marginL, y);
    }
    doc.setDrawColor(0);
  }

  // Footer supplied by the shared NTPC letterhead/footer helper.
  applyPdfLetterheadFooter(doc);

  return doc.output('datauristring');
}



function exportExcel(){
  // Simple multi-CSV export bundle (one CSV per sheet/tab in the data model)
  function toCsv(rows){
    if(!rows.length) return '';
    const cols = Object.keys(rows[0]);
    const esc = v => '"' + String(v===undefined||v===null?'':v).replace(/"/g,'""') + '"';
    return cols.join(',') + '\n' + rows.map(r=>cols.map(c=>esc(r[c])).join(',')).join('\n');
  }
  const files = {
    'templates.csv': toCsv(STATE.templates.map(t=>({id:t.id,name:t.name,category:t.category,frequencyDays:t.frequencyDays}))),
    'assets.csv': toCsv(STATE.assets.map(a=>({id:a.id,templateId:a.templateId,createdOn:a.createdOn,...a.fieldValues}))),
    'inspections.csv': toCsv(STATE.inspections.map(i=>({id:i.id,assetId:i.assetId,templateId:i.templateId,date:i.date,inspector:i.inspector,oneDriveUrl:i.oneDriveUrl||''})))
  };
  Object.entries(files).forEach(([name, content])=>{
    if(!content) return;
    const blob = new Blob([content], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
  });
  toast('Exported CSVs for templates, assets, and inspections.');
}

  const catInput = el('input', {value:t.category||''});
  const freqInput = el('input', {type:'number', value:t.frequencyDays});
  const titleInput = el('input', {value:t.pdfTitle||''});
  const docInput = el('input', {value:t.pdfDocCode||''});

  const repeatInput = el('input', {type:'number', value:t.reminderRepeatDays});
  const recipInput = el('input', {value:t.reminderRecipients||'', placeholder:'comma-separated emails'});
  const inspSigChk = el('input', {type:'checkbox', ...(t.requireInspectorSig?{checked:'checked'}:{})});
  const contSigChk = el('input', {type:'checkbox', ...(t.requireContractorSig?{checked:'checked'}:{})});
  const photoChk = el('input', {type:'checkbox', ...(t.requirePhoto?{checked:'checked'}:{})});

  function saveMeta(){
    t.name = nameInput.value; t.category = catInput.value; t.frequencyDays = Number(freqInput.value)||30;
    t.pdfTitle = titleInput.value; t.pdfDocCode = docInput.value;
    t.reminderLeadDays = Number(leadInput.value)||0; t.reminderRepeatDays = Number(repeatInput.value)||7;
    t.reminderRecipients = recipInput.value;
    t.requireInspectorSig = inspSigChk.checked; t.requireContractorSig = contSigChk.checked; t.requirePhoto = photoChk.checked;
    saveState();
  }
  [nameInput,catInput,freqInput,titleInput,docInput,leadInput,repeatInput,recipInput,inspSigChk,contSigChk,photoChk]
    .forEach(i=> i.addEventListener('change', ()=>{ saveMeta(); renderPreview(); }));

  // --- Asset fields panel ---
  const fieldsList = el('div', {class:'space-y-2'});
  function renderFields(){
    clear(fieldsList);
    t.assetFields.forEach((f, idx)=>{
      fieldsList.appendChild(fieldRow(f, idx));
    });
  }
  function fieldRow(f, idx){
    const label = el('input', {value:f.label, class:'flex-1'});
    const key = el('input', {value:f.key, class:'w-28 text-xs'});
    const type = el('select', {}, ['text','number','date','select','textarea'].map(o=>el('option',{value:o, ...(f.type===o?{selected:'selected'}:{})},[o])));
    const req = el('input', {type:'checkbox', title:'Required', ...(f.required?{checked:'checked'}:{})});
    const optsInput = el('input', {value:(f.options||[]).join(', '), placeholder:'options (comma-sep)', class:(f.type==='select'?'':'hidden')});
    type.addEventListener('change', ()=>{ f.type=type.value; optsInput.classList.toggle('hidden', f.type!=='select'); saveState(); renderPreview(); });
    label.addEventListener('change', ()=>{ f.label=label.value; saveState(); renderPreview(); });
    key.addEventListener('change', ()=>{ f.key=key.value.trim(); saveState(); renderPreview(); });
    req.addEventListener('change', ()=>{ f.required=req.checked; saveState(); });
    optsInput.addEventListener('change', ()=>{ f.options = optsInput.value.split(',').map(s=>s.trim()).filter(Boolean); saveState(); renderPreview(); });
    return el('div', {class:'card p-3'}, [
      el('div', {class:'flex items-center gap-2 mb-2'}, [
        el('span', {class:'drag-handle'}, ['⠿']), label,
        el('button', {class:'btn btn-danger', style:'padding:.2rem .5rem', onclick:()=>{ t.assetFields.splice(idx,1); saveState(); renderFields(); renderPreview(); }}, ['✕'])
      ]),
      el('div', {class:'flex items-center gap-2 text-xs'}, [
        el('span',{class:'text-slate-400'},['key:']), key, type,
        el('label', {class:'flex items-center gap-1'}, [req, 'required'])
      ]),
      optsInput
    ]);
  }
  const addFieldBtn = el('button', {class:'btn btn-ghost w-full', onclick:()=>{
    t.assetFields.push({key:'field'+(t.assetFields.length+1), label:'New Field', type:'text'});
    saveState(); renderFields(); renderPreview();
  }}, ['+ Add field']);

  // --- Checklist items panel ---
  const itemsList = el('div', {class:'space-y-2'});
  function renderItems(){
    clear(itemsList);
    t.checklistItems.forEach((it, idx)=> itemsList.appendChild(itemRow(it, idx)));
  }
  function itemRow(it, idx){
    const desc = el('textarea', {rows:'2', class:'flex-1'}, [it.description]);
    const rtype = el('select', {}, ['yes_no_na','pass_fail','rating_1_5','text','number'].map(o=>el('option',{value:o, ...(it.responseType===o?{selected:'selected'}:{})},[o])));
    const remark = el('select', {}, ['on_no','always','never'].map(o=>el('option',{value:o, ...(it.requiresRemark===o?{selected:'selected'}:{})},[o])));
    desc.addEventListener('change', ()=>{ it.description=desc.value; saveState(); renderPreview(); });
    rtype.addEventListener('change', ()=>{ it.responseType=rtype.value; saveState(); renderPreview(); });
    remark.addEventListener('change', ()=>{ it.requiresRemark=remark.value; saveState(); });
    return el('div', {class:'card p-3'}, [
      el('div', {class:'flex items-start gap-2'}, [
        el('span', {class:'drag-handle mt-2'}, ['⠿']),

function deleteAsset(t, a){
  if(!confirm('Delete this asset and its inspection history reference? This cannot be undone.')) return;
  const backupAsset = a;
  const backupInsp = STATE.inspections.filter(i=>i.assetId===a.id);
  STATE.assets = STATE.assets.filter(x=>x.id!==a.id);
  saveState(); render();
  toast('Asset deleted.', {undo:()=>{ STATE.assets.push(backupAsset); saveState(); render(); }});
}

function openAssetForm(t, existing){
  const values = existing ? {...existing.fieldValues} : {};
  const inputs = {};
  const bg = el('div', {class:'modal-bg'});
  const fieldsNode = el('div', {class:'space-y-3'});
  t.assetFields.forEach(f=>{
    let input;
    if(f.type==='select'){
      input = el('select', {}, (f.options||[]).map(o=>el('option', {value:o, ...(values[f.key]===o?{selected:'selected'}:{})}, [o])));
    } else if(f.type==='textarea'){
      input = el('textarea', {rows:'3'}, [values[f.key]||'']);
    } else {
      input = el('input', {type: f.type==='date'?'date':(f.type==='number'?'number':'text'), value: values[f.key]||''});
    }
    inputs[f.key] = input;
    fieldsNode.appendChild(labeled(f.label + (f.required?' *':''), input));
  });
  const box = el('div', {class:'modal-box p-6'}, [
    el('h3', {class:'font-head text-lg font-bold mb-4'}, [existing ? 'Edit asset' : 'Add asset — ' + t.name]),
    fieldsNode,
    el('div', {class:'flex justify-end gap-2 mt-5'}, [
      el('button', {class:'btn btn-ghost', onclick:()=>bg.remove()}, ['Cancel']),
      el('button', {class:'btn btn-primary', onclick:()=>{
        const fv = {};
        t.assetFields.forEach(f=> fv[f.key] = inputs[f.key].value);
        const missing = t.assetFields.filter(f=>f.required && !fv[f.key]);
        if(missing.length){ toast('Please fill: ' + missing.map(f=>f.label).join(', ')); return; }
        if(existing){ existing.fieldValues = fv; }
        else { STATE.assets.push({ id: uid('a'), templateId: t.id, createdOn: new Date().toISOString(), fieldValues: fv }); }
        saveState(); bg.remove(); render();
        toast(existing ? 'Asset updated.' : 'Asset added.');
      }}, [existing ? 'Save' : 'Add asset'])
    ])
  ]);
  bg.appendChild(box); document.body.appendChild(bg);
}

/* ============================================================
   INSPECTION MODAL — opens over any page (Asset List, Asset
   Detail, Reminders). Mirrors the compact inspection dialog style.
   ============================================================ */
function openInspectionModal(t, a){
  const dateInput = el('input', {type:'date', value: new Date().toISOString().slice(0,10)});
  const deptInput = el('input', {value:a.fieldValues.department||''});
  const areaInput = el('input', {value:a.fieldValues.area||''});
  const contractorInput = el('input', {value:a.fieldValues.contractor||''});
  const contractorNameInput = el('input', {placeholder:'Contractor name'});
  const inspectorInput = el('input', {placeholder:'Inspector name'});
  const obsInput = el('textarea', {rows:'2'});
  const correctiveInput = el('textarea', {rows:'2'});
  const inspSigInput = el('input', {type:'file', accept:'image/*'});
  const contSigInput = el('input', {type:'file', accept:'image/*'});
  const photoInput = el('input', {type:'file', accept:'image/*'});

  const answers = {};
  const itemRows = t.checklistItems.map(it=>{
    let responseNode;
    const isRequiredRemark = it.requiresRemark==='always';
    const remarkInput = el('input', {
      placeholder: 'Remarks' + (isRequiredRemark ? ' *' : ''),
      style: isRequiredRemark ? 'border-color:#ff3e1d; background:#fff2ef;' : ''
    });
    function setAnswer(v){ answers[it.no] = answers[it.no]||{}; answers[it.no].answer = v; }
    if(it.responseType==='yes_no_na' || it.responseType==='pass_fail'){
      const opts = it.responseType==='yes_no_na' ? ['Yes','No','N/A'] : ['Pass','Fail'];
      responseNode = el('div', {class:'radio-group flex gap-2 flex-wrap'}, opts.map(o=>{
        const radio = el('input', {type:'radio', name:'item'+it.no, value:o, onchange:()=>setAnswer(o)});
        return el('label', {}, [radio, el('span',{},[o])]);
      }));
    } else if(it.responseType==='rating_1_5'){
      responseNode = el('div', {class:'radio-group flex gap-2'}, [1,2,3,4,5].map(n=>{
        const radio = el('input', {type:'radio', name:'item'+it.no, value:String(n), onchange:()=>setAnswer(String(n))});
        return el('label', {}, [radio, el('span',{},[String(n)])]);
      }));
    } else {
      responseNode = el('input', {type: it.responseType==='number'?'number':'text', oninput:(e)=>setAnswer(e.target.value)});
    }
    answers[it.no] = { answer:'', remark:'' };
    remarkInput.addEventListener('input', ()=>{
      answers[it.no].remark = remarkInput.value;
      if(isRequiredRemark){ remarkInput.style.borderColor = remarkInput.value ? '' : '#ff3e1d'; remarkInput.style.background = remarkInput.value ? '' : '#fff2ef'; }
    });
    const descNode = isRequiredRemark
      ? el('span', {}, [it.description, el('span', {style:'color:#ff3e1d; font-weight:700;'}, [' *'])])
      : it.description;
    return [String(it.no), descNode, responseNode, it.requiresRemark==='never' ? '' : remarkInput];
  });

  function buildInspectionObj(){
    return {
      id: uid('insp'), assetId: a.id, templateId: t.id,
      date: dateInput.value, department: deptInput.value, area: areaInput.value,
      contractor: contractorInput.value, contractorName: contractorNameInput.value, inspector: inspectorInput.value,
      observations: obsInput.value, correctiveActions: correctiveInput.value,
      answers: t.checklistItems.map(it=> ({ itemNo: it.no, description: it.description, answer: (answers[it.no]||{}).answer||'', remark: (answers[it.no]||{}).remark||'' })),
      inspectorSignature: null, inspectorSigDims: null,
      contractorSignature: null, contractorSigDims: null,
      photo: null, photoDims: null,
      oneDriveUrl: ''
    };
  }

  // Pushes + saves together, and undoes the push if saveState() throws (e.g. storage
  // quota exceeded) — otherwise the record would sit in memory marked as "saved" when it
  // isn't, and hitting Save again would push a second duplicate copy on top of it.
  function persistInspection(insp){
    STATE.inspections.push(insp);
    try{
      saveState();
    }catch(err){
      STATE.inspections.pop();
      throw err;
    }
  }

  // The whole body is wrapped in try/catch so that ANY unexpected error (a bad image
  // file, a browser API that isn't available, etc.) always surfaces as a toast instead
  // of silently failing. Previously this was an async function used directly as an
  // onclick handler with no .catch() anywhere — if anything inside threw after the
  // synchronous validation checks, the returned promise just rejected into the void
  // (a console-only "Uncaught (in promise)" error), so the button looked like it was
  // doing nothing at all. See the wrapper below submitBtn.addEventListener for the
  // second layer of defense.
  async function submit(){
    try{
      if(!dateInput.value){ toast('Date is required.'); return; }
      if(t.requireInspectorSig && !inspectorInput.value.trim()){ toast('Inspector name is required.'); return; }
      if(t.requireInspectorSig && !inspSigInput.files[0]){ toast('Inspector signature is required.'); return; }
      if(t.requireContractorSig && !contractorNameInput.value.trim()){ toast('Contractor name is required.'); return; }
      if(t.requireContractorSig && !contSigInput.files[0]){ toast('Contractor signature is required.'); return; }
      if(t.requirePhoto && !photoInput.files[0]){ toast('Photo evidence is required.'); return; }
      const missingRemarks = t.checklistItems.filter(it=>{
        const ans = answers[it.no]||{};
        return it.requiresRemark==='always' && !ans.remark;
      });
      if(missingRemarks.length){
        toast('Please add a remark for: ' + missingRemarks.map(m=>'#'+m.no+' '+m.description).join('; '), {duration:6000});
        const box = document.querySelector('.insp-modal-body');
        if(box) box.scrollTop = 0;
        return;
      }

      const insp = buildInspectionObj();

      // Read the uploaded signature/photo files and pre-measure their aspect ratio so
      // the PDF can embed them properly instead of just leaving a blank line. Any of
      // these can fail (a corrupt file, an unsupported format like HEIC that the
      // browser can't decode into an <img>, etc.) — guard each one individually so one
      // bad file doesn't silently kill the whole submission.
      let inspSigData=null, contSigData=null, photoData=null;
      try{
        [inspSigData, contSigData, photoData] = await Promise.all([
          readFileAsCompressedDataURL(inspSigInput.files[0], 1000, 0.8),
          readFileAsCompressedDataURL(contSigInput.files[0], 1000, 0.8),
          readFileAsCompressedDataURL(photoInput.files[0], 1600, 0.72)
        ]);
      }catch(err){
        toast('Could not read an uploaded file (' + (err&&err.message||'unknown error') + '). Please re-select the file and try again.', {duration:8000});
        return;
      }
      if(inspSigData){ insp.inspectorSignature = inspSigData; insp.inspectorSigDims = await loadImageDims(inspSigData); }
      if(contSigData){ insp.contractorSignature = contSigData; insp.contractorSigDims = await loadImageDims(contSigData); }
      if(photoData){ insp.photo = photoData; insp.photoDims = await loadImageDims(photoData); }

      if(!window.jspdf || !window.jspdf.jsPDF){
        toast('PDF library failed to load (check your internet connection) — saving the inspection anyway. Use "Re-download PDF" from the asset history once the page can reach the internet.', {duration:8000});
        persistInspection(insp);
        bg.remove();
        render();
        return;
      }

      let pdfDataUri = null;
      try{
        pdfDataUri = generatePDF(t, a, insp);
      }catch(err){
        toast('PDF generation failed (' + err.message + ') — the inspection was still saved. Try "Re-download PDF" from the asset history.', {duration:8000});
        persistInspection(insp);
        bg.remove();
        render();
        return;
      }

      const pdfFileName = `${t.name}_${insp.date}_${a.fieldValues[t.assetFields[0].key]||a.id}.pdf`;
      if(msalInstance && isOneDriveConnected()){
        try{
          insp.oneDriveUrl = await uploadBytesToOneDrive(
            `${CONFIG.MS_GRAPH.FOLDER}/${t.name}/${pdfFileName}`,
            dataUriToBytes(pdfDataUri),
            'application/pdf'
          );
        }catch(e){
          toast('OneDrive upload failed (' + (e && e.message || 'unknown error') + ') — the PDF was still saved and downloaded locally.', {duration:8000});
        }
      } else if(CONFIG.GAS_URL){
        try{
          const resp = await fetch(CONFIG.GAS_URL, { method:'POST', body: new URLSearchParams({
            action:'uploadFile', fileName: pdfFileName,
            mimeType:'application/pdf', subfolderName:t.name, base64: pdfDataUri.split(',')[1]
          })});
          const j = await resp.json();
          insp.oneDriveUrl = j.url || '';
        }catch(e){ /* offline fallback below */ }
      }
      persistInspection(insp);
      downloadPdf(pdfDataUri, `${t.name}_${insp.date}.pdf`);
      bg.remove();
      toast('Inspection saved' + (insp.oneDriveUrl ? ' and uploaded to OneDrive.' : ' — PDF downloaded locally.'));
      render();
    }catch(err){
      console.error('Save & Generate PDF failed:', err);
      toast('Something went wrong saving this inspection (' + (err&&err.message||'unknown error') + '). Nothing was lost from the form — please try again.', {duration:8000});
    }
  }

  const checklistTable = gridTable(
    [
      {label:'#', width:'4%'},
      {label:'Description', width:'32%'},
      {label:'Yes / No / N/A', width:'36%'},
      {label:'Remarks', width:'28%'}
    ],
    itemRows.map(r=> [
      el('span', {class:'text-slate-400'}, [r[0]]),
      r[1],
      r[2],
      r[3]
    ]),
    {dividers:true}
  );

  const bg = el('div', {class:'modal-bg', style:'align-items:flex-start; padding-top:3vh;'});
  const box = el('div', {class:'insp-modal-box'}, [
    el('div', {class:'insp-modal-header'}, [
      el('div', {}, [
        el('div', {class:'text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1'}, [t.pdfTitle || t.name]),
        el('h3', {class:'font-head text-lg font-bold'}, ['Inspection — ' + (a.fieldValues[t.assetFields[0].key] || a.id)])
      ]),
      el('button', {class:'text-slate-400 hover:text-slate-700 text-xl leading-none', onclick:()=>bg.remove()}, ['✕'])
    ]),
    el('div', {class:'insp-modal-body'}, [
      el('div', {class:'card p-4 mb-4', style:'background:#f8fafc'}, [
        el('div', {class:'grid sm:grid-cols-3 gap-3'}, t.assetFields.map(f=>
          el('div', {}, [
            el('div', {class:'text-xs font-semibold text-slate-400 uppercase tracking-wide'}, [f.label]),
            el('div', {class:'font-semibold text-sm'}, [String(a.fieldValues[f.key]||'—')])
          ])
        ))
      ]),
      el('div', {class:'grid sm:grid-cols-2 gap-4 mb-4'}, [
        labeled('Inspection Date *', dateInput), labeled('Department / Section', deptInput)
      ]),
      el('div', {class:'grid sm:grid-cols-2 gap-4 mb-4'}, [
        labeled('Area', areaInput), labeled('Contractor / Agency', contractorInput)
      ]),
      el('div', {class:'mb-4'}, [
        el('div', {class:'field-label mb-2'}, ['Inspection checklist']),
        el('div', {class:'overflow-x-auto border border-slate-200 rounded-xl'}, [checklistTable])
      ]),
      el('div', {class:'grid sm:grid-cols-2 gap-4 mb-4'}, [
        labeled('Observations', obsInput), labeled('Corrective actions', correctiveInput)
      ]),
      el('div', {class:'grid sm:grid-cols-3 gap-4'}, [
        t.requireInspectorSig ? el('div', {}, [
          labeled('Inspector name *', inspectorInput),
          el('div', {class:'mt-2'}, [labeled('Inspector signature *', inspSigInput)])
        ]) : null,
        t.requireContractorSig ? el('div', {}, [
          labeled('Contractor name *', contractorNameInput),
          el('div', {class:'mt-2'}, [labeled('Contractor signature *', contSigInput)])
        ]) : null,
        t.requirePhoto ? labeled('Photo evidence *', photoInput) : null
      ])
    ]),
    el('div', {class:'insp-modal-footer', style:'justify-content:flex-end;'}, [
      el('div', {class:'flex gap-2'}, [
        el('button', {class:'btn btn-ghost', onclick:()=>bg.remove()}, ['Cancel']),
        el('button', {class:'btn btn-primary', onclick:()=>{ submit().catch(err=>{ console.error(err); toast('Unexpected error — please try again.'); }); }}, ['Save & Generate PDF'])
      ])
    ])
  ]);
  bg.appendChild(box);
  document.body.appendChild(bg);
}

route('/inspect/:assetId', ({params})=>{
  if(!hasRole('user')){ toast('You need User access to record inspections.'); navigate('/checklist'); return; }
  const a = STATE.assets.find(x=>x.id===params.assetId);
  if(!a){ navigate('/templates'); return; }
  const t = STATE.templates.find(x=>x.id===a.templateId);
  navigate('/assets/'+t.id+'/'+a.id);
  setTimeout(()=>openInspectionModal(t,a), 0);
});

/* ============================================================
   PDF GENERATION (jsPDF)
   ============================================================ */
function generatePDF(t, a, insp){
  if(t.id === 't_ppe') return generatePpePdf(t, a, insp);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  let y = 88;
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text(t.pdfTitle || t.name, pageW/2, y, {align:'center'}); y+=24;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text(`Department / Section: ${insp.department||'—'}`, 40, y);
  doc.text(`Area: ${insp.area||'—'}`, 40+240, y);
  doc.text(`Date: ${fmtDate(insp.date)}`, 40+400, y); y += 16;
  doc.text(`Contractor/Agency: ${insp.contractor||'—'}`, 40, y); y += 16;
  doc.text(`${t.assetFields[0].label}: ${a.fieldValues[t.assetFields[0].key]||'—'}`, 40, y); y += 24;
  const tableLeft = 40, tableRight = pageW-40, tw = tableRight-tableLeft;
  const colW = { no:26, resp:85, remark:115 }; colW.desc = tw-colW.no-colW.resp-colW.remark;
  const colX = {no:tableLeft, desc:tableLeft+colW.no, resp:tableLeft+colW.no+colW.desc, remark:tableLeft+colW.no+colW.desc+colW.resp};
  const vlines=[tableLeft,colX.desc,colX.resp,colX.remark,tableRight];
  function drawTableHeaderRow(startY){
    const h=20; doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setLineWidth(0.75);
    doc.line(tableLeft,startY,tableRight,startY); doc.line(tableLeft,startY+h,tableRight,startY+h); vlines.forEach(x=>doc.line(x,startY,x,startY+h));
    doc.text('#',colX.no+5,startY+14); doc.text('Description',colX.desc+5,startY+14); doc.text('Response',colX.resp+5,startY+14); doc.text('Remark',colX.remark+5,startY+14);
    doc.setFont('helvetica','normal'); return startY+h;
  }
  y=drawTableHeaderRow(y);
  insp.answers.forEach(row=>{
    const descLines=doc.splitTextToSize(row.description,colW.desc-10), remarkLines=doc.splitTextToSize(row.remark||'',colW.remark-10);
    const rowH=Math.max(descLines.length,remarkLines.length,1)*11+8;
    if(y+rowH>780){ doc.addPage(); drawPdfHeaderFooter(doc); y=88; y=drawTableHeaderRow(y); }
    const rowTop=y,rowBottom=y+rowH; doc.setLineWidth(0.5); vlines.forEach(x=>doc.line(x,rowTop,x,rowBottom)); doc.line(tableLeft,rowBottom,tableRight,rowBottom);
    doc.text(String(row.itemNo),colX.no+5,rowTop+12); doc.text(descLines,colX.desc+5,rowTop+12); doc.text(String(row.answer||'—'),colX.resp+5,rowTop+12); doc.text(remarkLines,colX.remark+5,rowTop+12); y=rowBottom;
  });
  y+=20;
  if(y>700){doc.addPage();drawPdfHeaderFooter(doc);y=88;}
  doc.setFont('helvetica','bold');doc.text('Observations:',40,y);y+=12; doc.setFont('helvetica','normal');doc.text(doc.splitTextToSize(insp.observations||'—',pageW-80),40,y);y+=28;
  doc.setFont('helvetica','bold');doc.text('Corrective Actions:',40,y);y+=12;doc.setFont('helvetica','normal');doc.text(doc.splitTextToSize(insp.correctiveActions||'—',pageW-80),40,y);y+=28;
  if(y>700){doc.addPage();drawPdfHeaderFooter(doc);y=88;}
  doc.setFont('helvetica','bold');doc.setFontSize(9);
  if(t.requireInspectorSig){
    const sigRowY = y;
    doc.setFont('helvetica','bold'); doc.setFontSize(9);
    doc.text('Inspector Signature:',40,sigRowY);
    placeSignature(doc,insp.inspectorSignature,insp.inspectorSigDims,175,sigRowY);
    // Inspector name is deliberately on the SAME ROW as the signature and
    // starts after the fixed signature area so the two can never overlap.
    doc.setFont('helvetica','bold'); doc.setFontSize(9);
    doc.text('Inspector Name: '+(insp.inspector||'—'),330,sigRowY);
    y = sigRowY + 60;
  }
  if(y>760){doc.addPage();drawPdfHeaderFooter(doc);y=88;}
  if(t.requireContractorSig){
    const sigRowY = y;
    doc.setFont('helvetica','bold'); doc.setFontSize(9);
    doc.text('Contractor Signature:',40,sigRowY);
    placeSignature(doc,insp.contractorSignature,insp.contractorSigDims,175,sigRowY);
    // Contractor name is deliberately on the SAME ROW as the signature and
    // starts after the fixed signature area so the two can never overlap.
    doc.setFont('helvetica','bold'); doc.setFontSize(9);
    doc.text('Contractor Name: '+(insp.contractorName||'—'),330,sigRowY);
    y = sigRowY + 60;
  }
  appendPhotoPage(doc,insp); applyPdfLetterheadFooter(doc);
  return doc.output('datauristring');
}

// Draws a signature image inline next to a label (or a blank underscore line if none
// was uploaded), and returns the y position for the next line.
function placeSignature(doc, dataUrl, dims, x, y){
  if(dataUrl){
    try{
      // Keep a compact, fixed signature zone so the name can safely occupy
      // the same row immediately to the right of the signature.
      const size = fitDims(dims, 110, 44);
      doc.addImage(dataUrl, pdfImageFormat(dataUrl), x, y-30, size.w, size.h);
    }catch(e){ doc.text('______________________', x, y); }
  } else {
    doc.text('______________________', x, y);
  }
  return y + 60;
}
// Appends a dedicated page with the uploaded photo evidence, scaled to fit and
// centered, only when a photo was actually provided.
function appendPhotoPage(doc, insp){
  if(!insp.photo) return;
  doc.addPage(); drawPdfHeaderFooter(doc);
  const pageW=doc.internal.pageSize.getWidth(), pageH=doc.internal.pageSize.getHeight();
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Photo Evidence',40,88);
  try{ const size=fitDims(insp.photoDims,pageW-80,pageH-160); const x=(pageW-size.w)/2; doc.addImage(insp.photo,pdfImageFormat(insp.photo),x,108,size.w,size.h); }catch(e){}
}

// Reconstructs per-PPE-item rows (PPE name / quantity / condition / remarks) from the
// paired "X — Quantity available" + "X — Condition" checklist answers.
function buildPpeRows(insp){
  const map = {};
  const order = [];
  insp.answers.forEach(ans=>{
    const m = ans.description.match(/^(.*)\s+—\s+(Quantity available|Condition)$/);
    if(!m) return;
    const base = m[1].trim();
    if(!map[base]){ map[base] = {ppe:base, quantity:'', condition:'', remarks:''}; order.push(base); }
    if(m[2]==='Quantity available'){ map[base].quantity = ans.answer || ''; }
    else { map[base].condition = ans.answer || ''; if(ans.remark) map[base].remarks = ans.remark; }
  });
  return order.map(b=>map[b]);
}

// Matches the original "QUARTERLY INSPECTION OF PPE" paper form layout: centered
// underlined title, header fields, a bordered # / PPE / Quantity / Condition / Remarks
// table, observations line, inspected-by / area engineer block, numbered corrective
// actions, and a contractor sign-off line — no doc-code or page-number footer.
function generatePpePdf(t, a, insp){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  const marginL = 45, marginR = 45;
  const usableW = pageW - marginL - marginR;
  drawPdfHeaderFooter(doc);
  let y = 88;

  // Title, centered + underlined
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  const title = t.pdfTitle || t.name;
  const titleW = doc.getTextWidth(title);
  doc.text(title, pageW/2, y, {align:'center'});
  doc.setLineWidth(0.7);
  doc.line(pageW/2 - titleW/2, y+3, pageW/2 + titleW/2, y+3);
  y += 34;

  // Header fields
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text(`Department / Section: ${insp.department||''}`, marginL, y);
  doc.text(`Area: ${insp.area||''}`, marginL+280, y);
  doc.text(`Date: ${fmtDate(insp.date)}`, marginL+420, y);
  y += 20;
  doc.text(`Contractor/Agency: ${insp.contractor||''}`, marginL, y); y += 20;
  doc.text(`Inspected by: ${insp.inspector||''}`, marginL, y); y += 30;

  // Table
  const rows = buildPpeRows(insp);
  const totalRows = Math.max(rows.length, 15);
  const colW = { no:26, ppe:150, qty:95, cond:95 };
  colW.remarks = usableW - colW.no - colW.ppe - colW.qty - colW.cond;
  const rowH = 20;
  const tableTop = y;
  const colX = {
    no: marginL,
    ppe: marginL + colW.no,
    qty: marginL + colW.no + colW.ppe,
    cond: marginL + colW.no + colW.ppe + colW.qty,
    remarks: marginL + colW.no + colW.ppe + colW.qty + colW.cond
  };
  const tableBottom = tableTop + rowH * (totalRows + 1);

  doc.setLineWidth(0.75);
  // outer + column verticals
  [colX.no, colX.ppe, colX.qty, colX.cond, colX.remarks, marginL+usableW].forEach(x=>{
    doc.line(x, tableTop, x, tableBottom);
  });
  // row horizontals
  for(let i=0;i<=totalRows+1;i++){
    const ry = tableTop + i*rowH;
    doc.line(marginL, ry, marginL+usableW, ry);
  }

  // header row labels
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  const headerY = tableTop + rowH/2 + 3;
  doc.text('#', colX.no+8, headerY);
  doc.text('PPE', colX.ppe+6, headerY);
  doc.text('QUANTITY', colX.qty+6, headerY);
  doc.text('CONDITION', colX.cond+6, headerY);
  doc.text('REMARKS', colX.remarks+6, headerY);

  // data rows
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  for(let i=0;i<totalRows;i++){
    const r = rows[i];
    const cy = tableTop + rowH*(i+2) - rowH/2 + 3;
    doc.text(String(i+1), colX.no+8, cy);
    if(r){
      doc.text(String(r.ppe||''), colX.ppe+6, cy);
      doc.text(String(r.quantity||''), colX.qty+6, cy);
      doc.text(String(r.condition||''), colX.cond+6, cy);
      doc.text(doc.splitTextToSize(String(r.remarks||''), colW.remarks-10), colX.remarks+6, cy);
    }
  }
  y = tableBottom + 34;

  // Observations
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text('Additional Observations, incl. positives & penal actions taken:', marginL, y); y += 16;
  const obsLines = doc.splitTextToSize(insp.observations || '', usableW);
  if(obsLines.length){ doc.text(obsLines, marginL, y); y += obsLines.length*13; }
  doc.setDrawColor(150); doc.line(marginL, y, marginL+usableW, y); y += 26;

  doc.setFont('helvetica','bold');
  doc.text('INSPECTED BY:', marginL, y); y += 20;
  const inspectorSigRowY = y;
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('Inspector Signature:', marginL, inspectorSigRowY);
  placeSignature(doc, insp.inspectorSignature, insp.inspectorSigDims, marginL+130, inspectorSigRowY);
  // Keep the inspector name on the same row, after the signature area.
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text(`Inspector Name: ${insp.inspector||'—'}`, marginL+300, inspectorSigRowY);
  y = inspectorSigRowY + 60;

  doc.setFont('helvetica','bold');
  doc.text('Corrective Actions completed:', marginL, y); y += 18;
  doc.setFont('helvetica','normal');
  const actions = (insp.correctiveActions||'').split('\n').map(s=>s.trim()).filter(Boolean);
  for(let i=0;i<3;i++){
    doc.text(`${i+1} ${actions[i] ? '- ' + actions[i] : '--------'}`, marginL, y);
    y += 18;
  }
  y += 12;

  doc.setFont('helvetica','bold');
  const contractorSigY = y;
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('Contractor Signature:', marginL, contractorSigY);
  placeSignature(doc, insp.contractorSignature, insp.contractorSigDims, marginL+130, contractorSigY);
  // Keep the contractor name on the same row, after the signature area.
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text(`Contractor Name: ${insp.contractorName||'—'}`, marginL+300, contractorSigY);

  appendPhotoPage(doc, insp);
  applyPdfLetterheadFooter(doc);
  return doc.output('datauristring');
}
function downloadPdf(dataUri, filename){
  const a = document.createElement('a');
  a.href = dataUri; a.download = filename; a.click();
}
function regeneratePdf(t,a,insp){
  const uri = generatePDF(t,a,insp);
  downloadPdf(uri, `${t.name}_${insp.date}.pdf`);
}

/* ============================================================
   RENDER DISPATCH
   ============================================================ */
function render(){
  if(!currentUser()){ renderLogin(); return; }
  const r = currentRoute();
  if(r) r.handler(r);
  else { location.hash = '/'; routes['/']({params:{}}); }
}
