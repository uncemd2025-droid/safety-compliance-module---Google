<!DOCTYPE html>
<html lang="en">

<style>
  :root{
    /* Sneat design tokens (pulled from the actual template's SCSS variables) */
    --ink:#2b2c40; --sub:#7a838b; --line:#e9eaec; --card:#fff; --bg:#f7f7f9;
    --sidebar-w:260px;
    /* primary = Sneat purple #696cff; reused for role/indigo accents to match Sneat's mostly-monochrome branding */
    --sky:#696cff; --sky-l:#ebebfe;
    --indigo:#696cff; --indigo-l:#ebebfe;
    --amber:#a36400; --amber-l:#fff3d6;      /* warning #ffab00, readable text tint */
    --green:#3a8a1a; --green-l:#e8f9e0;      /* success #71dd37, readable text tint */
    --red:#c92c12; --red-l:#ffe4df;          /* danger #ff3e1d, readable text tint */
    --info:#04889f; --info-l:#d9f7fc;        /* info #03c3ec, readable text tint */
    --shadow-sm:0 .125rem .375rem 0 rgba(34,48,62,.08);
    --shadow:0 .1875rem .5rem 0 rgba(34,48,62,.1);
  }
  *{font-family:'Public Sans',-apple-system,'Segoe UI',sans-serif;}
  a{text-decoration:none; color:inherit;}
  h1,h2,h3,h4,.font-head{font-family:'Public Sans',sans-serif; font-weight:700;}
  body{background:var(--bg); color:var(--ink);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:.625rem; box-shadow:var(--shadow-sm); transition:box-shadow .18s ease, transform .18s ease;}
  .card:hover{box-shadow:var(--shadow);}
  .btn{display:inline-flex; align-items:center; gap:.4rem; font-weight:500; border-radius:.375rem; padding:.5rem 1rem; transition:background-color .15s ease, transform .1s ease, box-shadow .15s ease; font-size:.875rem; cursor:pointer; border:none;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:#696cff; color:#fff; box-shadow:0 .125rem .25rem 0 rgba(105,108,255,.4);} .btn-primary:hover{background:#5f61e0;}
  .btn-ghost{background:#fff; border:1px solid var(--line); color:var(--ink);} .btn-ghost:hover{background:#f7f7f9;}
  .btn-danger{background:var(--red-l); color:var(--red);} .btn-danger:hover{background:#ffd4cb;}
  .btn-indigo{background:#696cff; color:#fff;} .btn-indigo:hover{background:#5f61e0;}
  .btn-success{background:#71dd37; color:#fff; box-shadow:0 .125rem .25rem 0 rgba(113,221,55,.4);} .btn-success:hover{background:#64c72f;}
  input,select,textarea{border:1px solid var(--line); border-radius:.375rem; padding:.5rem .8rem; font-size:.875rem; width:100%; background:#fff; color:var(--ink);}
  input:focus,select:focus,textarea:focus{outline:none; border-color:#696cff; box-shadow:0 .125rem .25rem 0 rgba(105,108,255,.4);}
  label.field-label{font-size:.75rem; font-weight:600; color:var(--sub); text-transform:uppercase; letter-spacing:.03em; margin-bottom:.25rem; display:block;}
  .pill{display:inline-flex; align-items:center; gap:.3rem; font-size:.7rem; font-weight:600; padding:.25rem .65rem; border-radius:50rem; letter-spacing:.02em; transition:background-color .2s ease, color .2s ease;}
  .status-ok{background:var(--green-l); color:var(--green);}
  .status-warn-30{background:var(--amber-l); color:var(--amber);}
  .status-danger{background:var(--red-l); color:var(--red);}
  .status-none{background:#eceef0; color:var(--sub);}
  .page-wrap{max-width:1680px; margin-left:auto; margin-right:auto;}
  /* Grid-table system: every row (including the header) is an independent CSS Grid
     with an IDENTICAL grid-template-columns string, so header and data columns are
     structurally forced to align — this avoids relying on HTML <table> column layout,
     which can behave inconsistently across browser/webview engines. */
  .grid-table{width:100%; font-size:.88rem;}
  .gt-row{display:grid; align-items:stretch;}
  .gt-row.gt-head{background:#f7f7f9;}
  .gt-row:not(.gt-head){border-bottom:1px solid var(--line); transition:background-color .12s ease;}
  .gt-row:not(.gt-head):hover{background:#fbfbfc;}
  .gt-cell{padding:.9rem 1.5rem; display:flex; align-items:center; overflow:hidden; min-width:0;}
  .gt-cell.wrap{white-space:normal; overflow-wrap:break-word;}
  .grid-table.gt-dividers .gt-cell{border-right:1px solid var(--line);}
  .grid-table.gt-dividers .gt-cell:last-child{border-right:none;}
  .gt-head .gt-cell{padding:1rem 1.5rem; font-weight:700; font-size:.72rem; letter-spacing:.04em; text-transform:uppercase; color:var(--sub); border-bottom:1px solid var(--line); white-space:nowrap;}
  .gt-cell.text-right{justify-content:flex-end; text-align:right;}
  .badge-count{display:inline-flex; align-items:center; font-size:.78rem; font-weight:600; padding:.25rem .7rem; border-radius:50rem; background:var(--green-l); color:var(--green);}
  .insp-modal-box{background:#fff; border-radius:.625rem; max-width:1040px; width:100%; max-height:92vh; display:flex; flex-direction:column; overflow:hidden; animation:slideUp .18s ease;}
  .insp-modal-header{padding:1.1rem 1.5rem .9rem; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; justify-content:space-between; gap:1rem;}
  .insp-modal-body{overflow-y:auto; padding:1.25rem 1.5rem;}
  .insp-modal-footer{border-top:1px solid var(--line); padding:.9rem 1.5rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;}
  .group-banner{background:#ebebfe; border-left:3px solid #696cff; padding:.75rem 1.1rem; border-radius:.5rem; margin-bottom:.75rem;}
  [id^="grp-"]{scroll-margin-top:24px;}
  .role-chip{font-size:.7rem; font-weight:700; padding:.2rem .55rem; border-radius:50rem; text-transform:uppercase; letter-spacing:.03em;}
  .role-admin{background:var(--indigo-l); color:#696cff;}
  .role-user{background:var(--info-l); color:var(--info);}
  .role-viewer{background:#eceef0; color:var(--sub);}
  .modal-bg{position:fixed; inset:0; background:rgba(34,48,62,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:1rem; animation:fadeIn .15s ease;}
  .modal-box{background:#fff; border-radius:.625rem; max-width:640px; width:100%; max-height:90vh; overflow:auto; animation:slideUp .18s ease;}
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  @keyframes slideUp{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
  @keyframes pageIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
  @keyframes toastIn{from{opacity:0; transform:translate(-50%,12px)} to{opacity:1; transform:translate(-50%,0)}}
  .page-fade{animation:pageIn .22s ease;}
  .toast{position:fixed; bottom:1.25rem; left:50%; transform:translateX(-50%); background:#2b2c40; color:#fff; padding:.7rem 1.1rem; border-radius:.5rem; font-size:.85rem; z-index:100; display:flex; gap:.75rem; align-items:center; box-shadow:var(--shadow-lg,0 .25rem .75rem rgba(34,48,62,.3)); animation:toastIn .2s ease;}
  .radio-group{display:flex; flex-wrap:nowrap !important; align-items:center;}
  .radio-group label{display:inline-flex; align-items:center; gap:.3rem; border:1px solid var(--line); padding:.35rem .55rem; border-radius:.375rem; cursor:pointer; font-size:.8rem; font-weight:500; white-space:nowrap !important; word-break:normal !important; overflow-wrap:normal !important; flex:0 0 auto;}
  .radio-group input:checked + span{font-weight:700;}
  .radio-group label:has(input:checked){border-color:#696cff; background:var(--sky-l);}
  .drag-handle{cursor:grab; color:#bdc1c5;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:1rem;}
  @media (max-width:640px){ .row2{grid-template-columns:1fr;} }
  .nav-link{padding:.4rem .8rem; border-radius:.375rem; font-weight:600; font-size:.82rem; color:var(--sub); background:#f7f7f9; transition:background-color .15s ease, color .15s ease; display:inline-flex; align-items:center;}
  .nav-link:hover{background:#ebebfe; color:#696cff;}
  ::-webkit-scrollbar{width:8px; height:8px;} ::-webkit-scrollbar-thumb{background:#bdc1c5; border-radius:8px;}

  /* ===== Sneat-style layout shell: fixed left sidebar + slim top navbar ===== */
  .sneat-sidebar{position:fixed; top:0; left:0; bottom:0; width:var(--sidebar-w); background:#fff; border-right:1px solid var(--line); z-index:40; display:flex; flex-direction:column; overflow-y:auto;}
  .sneat-brand{display:flex; align-items:center; gap:.6rem; padding:1.35rem 1.5rem; flex-shrink:0;}
  .sneat-brand .brand-icon{width:34px; height:34px; border-radius:.5rem; background:#696cff; color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex-shrink:0;}
  .sneat-brand .brand-text{font-weight:700; font-size:1.05rem; color:var(--ink); line-height:1.1;}
  .sneat-brand .brand-sub{font-size:.68rem; color:var(--sub); font-weight:500;}
  .sneat-menu{padding:.5rem .75rem 1.5rem; flex:1;}
  .sneat-menu-label{font-size:.68rem; font-weight:700; color:#bdc1c5; text-transform:uppercase; letter-spacing:.04em; padding:1rem .75rem .35rem;}
  .sneat-menu-link{display:flex; align-items:center; gap:.7rem; padding:.6rem .75rem; border-radius:.375rem; color:#5f6b7a; font-weight:500; font-size:.9rem; margin-bottom:.15rem; transition:background-color .15s ease, color .15s ease;}
  .sneat-menu-link i{font-size:1.15rem; flex-shrink:0;}
  .sneat-menu-link:hover{background:#f7f7f9; color:var(--ink);}
  .sneat-menu-link.active{background:#696cff; color:#fff; box-shadow:0 .125rem .375rem 0 rgba(105,108,255,.45);}
  .sneat-menu-link.active i{color:#fff;}
  .sneat-main{margin-left:var(--sidebar-w);}
  .sneat-navbar{background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30;}
  @media (max-width:900px){
    .sneat-sidebar{transform:translateX(-100%); transition:transform .2s ease;}
    .sneat-sidebar.open{transform:translateX(0); box-shadow:var(--shadow);}
    .sneat-main{margin-left:0;}
  }
</style>
</style>
</head>

// Reads a File as a base64 data URL (used for embedding signatures/photos into PDFs).
function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    if(!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = ()=> reject(reader.error);
    reader.readAsDataURL(file);
  });
}
// Loads an image data URL just to read its natural pixel dimensions, so PDFs can
// place it at the correct aspect ratio instead of stretching it.
function loadImageDims(dataUrl){
  return new Promise((resolve)=>{
    if(!dataUrl){ resolve(null); return; }
    const img = new Image();
    img.onload = ()=> resolve({w:img.naturalWidth||1, h:img.naturalHeight||1});
    img.onerror = ()=> resolve(null);
    img.src = dataUrl;
  });
}
// Scales natural {w,h} down to fit within maxW x maxH, preserving aspect ratio.
function fitDims(natural, maxW, maxH){
  if(!natural) return {w:maxW, h:maxH};
  const ratio = Math.min(maxW/natural.w, maxH/natural.h, 1);
  return {w: Math.round(natural.w*ratio), h: Math.round(natural.h*ratio)};
}
// jsPDF's addImage needs a format hint matching the data URL's mime type.
function pdfImageFormat(dataUrl){
  if(!dataUrl) return 'PNG';
  const m = dataUrl.match(/^data:image\/(png|jpe?g|webp)/i);
  if(!m) return 'PNG';
  const type = m[1].toLowerCase();
  return type==='png' ? 'PNG' : (type==='webp' ? 'WEBP' : 'JPEG');
}

/* ============================================================
   STATE + PERSISTENCE  (localStorage now; swap in GAS_URL fetches
   to point at the Apps Script backend in apps_script.gs later —
   the shape of STATE mirrors the Sheet tabs described in the spec)
   ============================================================ */
const LS_KEY = 'ucim_state_v1';
let STATE = { templates:[], assets:[], inspections:[], tempConnections:[] };

function loadState(){
  const raw = localStorage.getItem(LS_KEY);
  if(raw){
    try{ STATE = JSON.parse(raw); }catch(e){ STATE = { templates:[], assets:[], inspections:[], tempConnections:[] }; }
  }
  if(!STATE.templates || STATE.templates.length===0){
    STATE.templates = JSON.parse(JSON.stringify(SEED_TEMPLATES));
    STATE.assets = STATE.assets || [];
    STATE.inspections = STATE.inspections || [];
    STATE.tempConnections = STATE.tempConnections || [];
    saveState();
  }
  STATE.tempConnections = STATE.tempConnections || []; // backward-compat for sessions saved before this feature existed
}

function saveState(){
  localStorage.setItem(LS_KEY, JSON.stringify(STATE));
  localStorage.setItem(LS_KEY + '_backup_' + new Date().toISOString().slice(0,10), JSON.stringify(STATE));
  if(CONFIG.GAS_URL){
    fetch(CONFIG.GAS_URL, {
      method:'POST',
      body: new URLSearchParams({ data: JSON.stringify(STATE) })
    }).catch(()=>{ /* offline — localStorage backup already saved */ });
  }
}

/* ============================================================
   DOM helper
   ============================================================ */
function el(tag, attrs, children){
  const node = document.createElement(tag);
  attrs = attrs || {};
  for(const k in attrs){
    if(k==='class') node.className = attrs[k];
    else if(k==='html') node.innerHTML = attrs[k];
    else if(k.startsWith('on') && typeof attrs[k]==='function') node.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k]!==undefined && attrs[k]!==null) node.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c=>{
    if(c===null||c===undefined) return;
    node.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
  });
  return node;
}
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }

// Builds a set of CSS Grid "rows" (header + data) that all share the exact same
// grid-template-columns string. Because every row is an independent grid using the
// identical column definition, header and data cells are structurally forced to the
// same column boundaries — this sidesteps HTML <table> column-layout inconsistencies
// seen in some browser/webview rendering engines.
// columns: [{label, width, align}]  width is any CSS track size, e.g. '28%', '140px', '1fr'
// rows: array of arrays of DOM nodes/strings, same length as columns
function gridTable(columns, rows, opts){
  opts = opts || {};
  const templateCols = columns.map(c=> c.width || '1fr').join(' ');
  function buildRow(cellValues, isHead){
    const row = el('div', {class:'gt-row'+(isHead?' gt-head':''), style:'grid-template-columns:'+templateCols});
    cellValues.forEach((val,i)=>{
      const col = columns[i] || {};
      const cls = 'gt-cell' + (col.align==='right'?' text-right':'') + (opts.wrap===false?'':' wrap');
      const content = isHead ? [val] : (Array.isArray(val) ? val : [val]);
      row.appendChild(el('div', {class:cls}, content));
    });
    return row;
  }
  const container = el('div', {class:'grid-table'+(opts.dividers?' gt-dividers':'')});
  container.appendChild(buildRow(columns.map(c=>c.label), true));
  rows.forEach(r=> container.appendChild(buildRow(r, false)));
  return container;
}

function toast(msg, opts){
  opts = opts||{};
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = el('div', {class:'toast'}, [
    el('span', {}, [msg]),
    opts.undo ? el('button', {class:'btn btn-ghost', style:'padding:.2rem .6rem;background:#1e293b;color:#fff;border-color:#334155', onclick:()=>{ opts.undo(); t.remove(); }}, ['Undo']) : null
  ]);
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), opts.duration || 3500);
}

}

/* ============================================================
   DUE-DATE / STATUS HELPERS
   ============================================================ */
function lastInspectionDate(assetId){
  const rows = STATE.inspections.filter(i=>i.assetId===assetId).sort((a,b)=> new Date(b.date)-new Date(a.date));
  return rows.length ? rows[0].date : null;
}
function nextDueDate(asset, tmpl){
  const last = lastInspectionDate(asset.id);
  const base = last ? new Date(last) : new Date(asset.createdOn);
  const due = new Date(base);
  due.setDate(due.getDate() + (tmpl.frequencyDays||30));
  return due;
}
function statusFor(asset, tmpl){
  const due = nextDueDate(asset, tmpl);
  const now = new Date();
  const daysLeft = Math.ceil((due - now) / 86400000);
  if(daysLeft < 0) return {label:`Overdue ${Math.abs(daysLeft)}d`, cls:'status-danger', daysLeft};
  if(daysLeft <= (tmpl.reminderLeadDays||5)) return {label:`Due in ${daysLeft}d`, cls:'status-warn-30', daysLeft};
  return {label:`OK · due in ${daysLeft}d`, cls:'status-ok', daysLeft};
}
function pill(status){ return el('span', {class:'pill '+status.cls}, [status.label]); }
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}); }

/* ============================================================
   ROUTER
   ============================================================ */
const routes = {};
function route(pattern, handler){ routes[pattern] = handler; }
function navigate(hash){ location.hash = hash; }
function currentRoute(){
  const hash = location.hash.slice(1) || '/';
  for(const pattern in routes){
    const keys = [];
    const rx = new RegExp('^' + pattern.replace(/:[^/]+/g, m=>{ keys.push(m.slice(1)); return '([^/]+)'; }) + '$');
    const m = hash.match(rx);
    if(m){
      const params = {};
      keys.forEach((k,i)=> params[k] = decodeURIComponent(m[i+1]));
      return { handler: routes[pattern], params };
    }
  }
  return null;
}
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', ()=>{
  if(!currentUser()){ renderLogin(); return; }
  loadState(); render();
});

let _chartInstances = [];
function destroyCharts(){ _chartInstances.forEach(c=>c.destroy()); _chartInstances = []; }

route('/', ()=>{
  destroyCharts();

  // Assets per checklist group (bar)
  const groupCounts = {};
  GROUP_ORDER.concat(['Other']).forEach(g=> groupCounts[g]=0);
  STATE.templates.forEach(t=>{
    const n = STATE.assets.filter(a=>a.templateId===t.id).length;
    groupCounts[groupOf(t)] = (groupCounts[groupOf(t)]||0) + n;
  });
  const groupLabels = Object.keys(groupCounts).filter(g=> g!=='Other' || groupCounts[g]>0);

  // Status distribution across all assets (pie)
  let ok=0, dueSoon=0, overdue=0;
  STATE.templates.forEach(t=>{
    STATE.assets.filter(a=>a.templateId===t.id).forEach(a=>{
      const s = statusFor(a,t);
      if(s.cls==='status-danger') overdue++; else if(s.cls==='status-warn-30') dueSoon++; else ok++;

  const totalAssets = ok+dueSoon+overdue;

/* ============================================================================
   TEMPORARY ELECTRICAL CONNECTION MODULE
   Integrated from the standalone NTPC Unchahar temp-connection frontend.
   Data lives in STATE.tempConnections (localStorage, same as everything else
   in this app) so a request submitted on "New Request" shows up immediately
   on "Approver" and "Register" — no separate backend needed.
   ============================================================================ */
const TC_DEPARTMENTS = ['AHM','Ash Utilisation','AUTO BASE','BMD','C&I','C&M','CHEMISTRY','CIVIL','EEMG','EMD','ENVT. MGT.','FM','FQA','HR','IT','MEDICAL','MTP','OFS','OPERATION','PROJECT','SAFETY','TMD'];
const TC_PURPOSES = ['Area illumination','Welding','Pump','Belt jointing machine','SR Machine Supply','Other'];
const TC_CHECKLIST_ITEMS = [
  { key:'board', label:'Extension board / SFU panel is in healthy condition' },
  { key:'joints', label:'No loose connection — all joints properly insulated' },
  { key:'ir', label:'Extension cable IR value checked and found OK' },
  { key:'elcb', label:'ELCB provided (if applicable)' },
  { key:'earthing', label:'Supply earthing is proper' }
];
function tcStatusPill(status){
  const cls = status==='Issued' ? 'status-ok' : status==='Rejected' ? 'status-danger' : 'status-warn-30';
  return el('span', {class:'pill '+cls}, [status]);
}
function tcNextSlNo(){
  const n = STATE.tempConnections.filter(r=>r.slNo).length + 1;
  return 'TC-' + String(n).padStart(4,'0');
}

/* ---- Page: New Request (#/temp-connection) ---- */
route('/temp-connection', ()=>{
  const locInput = el('input', {placeholder:'e.g. Unit-3 Boiler platform, Bay 4'});
  const fromInput = el('input', {type:'date'});
  const toInput = el('input', {type:'date'});
  const reqInput = el('textarea', {rows:'2', placeholder:'e.g. 2 x 500W flood lights, 5 HP pump'});
  const nameInput = el('input', {});
  const designationInput = el('input', {});
  const empNoInput = el('input', {});
  const deptSelect = el('select', {}, [el('option',{value:''},['Select department…']), ...TC_DEPARTMENTS.map(d=>el('option',{value:d},[d]))]);
  const forwardingInput = el('input', {});
  const otherInput = el('input', {placeholder:'If Other — specify', style:'display:none; margin-top:.5rem;'});
  const declareChk = el('input', {type:'checkbox'});
  const errBox = el('div', {class:'text-sm', style:'color:var(--red); display:none;'});

  let supplyType = '';
  const supplyBtns = ['1 Phase','3 Phase'].map(s=>{
    const b = el('button', {type:'button', class:'btn btn-ghost', onclick:()=>{
      supplyType = s;
      supplyBtns.forEach(x=>{ x.style.borderColor=''; x.style.background=''; x.style.color=''; });
      b.style.borderColor='#696cff'; b.style.background='var(--sky-l)'; b.style.color='#696cff';
    }}, [s]);
    return b;
  });

  const purposeChecks = {};
  const purposeRow = el('div', {class:'flex flex-wrap gap-2'}, TC_PURPOSES.map(p=>{
    const cb = el('input', {type:'checkbox', value:p});
    purposeChecks[p] = cb;
    const label = el('label', {class:'btn btn-ghost', style:'cursor:pointer;'}, [cb, el('span',{style:'margin-left:.4rem;'},[p])]);
    cb.addEventListener('change', ()=>{
      label.style.borderColor = cb.checked ? '#696cff' : '';
      label.style.background = cb.checked ? 'var(--sky-l)' : '';
      otherInput.style.display = purposeChecks['Other'].checked ? 'block' : 'none';
    });
    return label;
  }));

  function submitRequest(){
    errBox.style.display = 'none';
    const purposes = TC_PURPOSES.filter(p=>purposeChecks[p].checked);
    if(!locInput.value.trim() || !supplyType || !fromInput.value || !toInput.value || !purposes.length ||
       !nameInput.value.trim() || !designationInput.value.trim() || !empNoInput.value.trim() || !deptSelect.value || !forwardingInput.value.trim()){
      errBox.textContent = 'Please fill all required fields (marked *).'; errBox.style.display='block'; return;
    }
    if(!declareChk.checked){
      errBox.textContent = 'Please agree to the declaration before submitting.'; errBox.style.display='block'; return;
    }
    const req = {
      id: uid('tc'), location: locInput.value.trim(), supplyType,
      periodFrom: fromInput.value, periodTo: toInput.value,
      purposes, purposeOther: otherInput.value.trim(),
      requirement: reqInput.value.trim(),
      applicantName: nameInput.value.trim(), designation: designationInput.value.trim(),
      empNo: empNoInput.value.trim(), department: deptSelect.value, forwarding: forwardingInput.value.trim(),
      declared: true, status:'Pending', submittedAt: new Date().toISOString(),
      slNo:'', issuedAt:'', technicianName:'', connectionDate:'', checklist:{}, rejectReason:''
    };
    STATE.tempConnections.push(req);
    saveState();
    let pdfNote = '';
    try{ downloadPdf(generateTempConnectionPdf(req), `TempConnection_${req.location.replace(/[^a-z0-9]+/gi,'_')}.pdf`); }
    catch(e){ pdfNote = ' (PDF generation failed — request was still saved.)'; }
    renderConfirmation(req, pdfNote);
  }

  function renderConfirmation(req, pdfNote){
    shell(el('div', {class:'max-w-lg mx-auto text-center card p-8'}, [
      el('div', {class:'pill status-warn-30', style:'margin:0 auto 1rem; width:fit-content;'}, ['Pending review']),
      el('h2', {class:'font-head text-xl font-bold mb-2'}, ['Request submitted']),
      el('p', {class:'text-sm text-slate-500 mb-4'}, ['Your request for ', el('b',{},[req.location]), ' is now pending EMD review.' + pdfNote]),
      el('div', {class:'flex gap-2 justify-center'}, [
        el('a', {href:'#/temp-connection', class:'btn btn-primary'}, ['Submit another request'])
      ])
    ]));
  }

  shell(el('div', {}, [
    pageHeader('Temporary Electrical Connection', 'Requisition — to be filled by the applicant. A PDF copy downloads automatically on submission.'),
    el('div', {class:'card p-6 space-y-5 max-w-3xl'}, [
      el('div', {}, [
        el('div', {class:'font-head font-bold mb-3'}, ['Connection details']),
        labeled('Area / location where connection is required *', locInput)
      ]),
      el('div', {class:'row2'}, [
        el('div', {}, [el('label',{class:'field-label'},['Type of supply *']), el('div',{class:'flex gap-2'}, supplyBtns)]),
        el('div', {}, [el('label',{class:'field-label'},['Time period *']), el('div',{class:'flex gap-2 items-center'}, [fromInput, el('span',{class:'text-slate-400 text-sm'},['to']), toInput])])
      ]),
      el('div', {}, [
        el('label',{class:'field-label'},['Purpose of which supply is required *']),
        purposeRow, otherInput
      ]),
      labeled('Please specify requirement (no. of light fittings / pump HP / amps)', reqInput),
      el('div', {style:'border-top:1px solid var(--line)'}),
      el('div', {class:'font-head font-bold'}, ['Applicant details']),
      el('div', {class:'row2'}, [
        labeled('Name of applicant *', nameInput), labeled('Designation *', designationInput)
      ]),
      el('div', {class:'row2'}, [
        labeled('Employee no. *', empNoInput), labeled('Department *', deptSelect)
      ]),
      labeled('Forwarding officer / HOD name *', forwardingInput),
      el('div', {style:'border-top:1px solid var(--line)'}),
      el('div', {class:'font-head font-bold'}, ['Declaration']),
      el('div', {class:'text-sm text-slate-500', style:'background:#f7f7f9; border-radius:.5rem; padding:1rem;'}, [
        el('ul', {style:'margin:0; padding-left:1.1rem; line-height:1.6;'}, [
          el('li',{},['I/We will ensure there is no unauthorised addition or alteration to the temporary supply that could increase load or create an unsafe condition.']),
          el('li',{},['I/We will ensure connected equipment (welding machine, pump, etc.) is healthy and properly earthed.']),
          el('li',{},['I/We will abide by electrical safety rules and ensure safe working on the temporary connection.']),
          el('li',{},['I/We will inform EMD to disconnect immediately after work completion and will not leave the connection unattended.'])
        ])
      ]),
      el('label', {style:'display:flex; align-items:center; gap:.5rem; font-size:.875rem;'}, [declareChk, 'I/We agree to the declaration above *']),
      errBox,
      el('div', {}, [el('button', {class:'btn btn-primary', onclick:submitRequest}, ['Submit request'])])
    ])
  ]));
});

/* ---- Page: Approver detail / decision (#/temp-connection/approve/:id) ---- */
route('/temp-connection/approve/:id', ({params})=>{
  if(!hasRole('user')){ toast('You need User access to review requests.'); navigate('/temp-connection/register'); return; }
  const req = STATE.tempConnections.find(r=>r.id===params.id);
  if(!req){ navigate('/temp-connection/approve'); return; }

  const summary = el('div', {class:'card p-5 space-y-1 text-sm'}, [
    el('div', {class:'font-head font-bold text-base mb-2'}, [req.location]),
    el('p', {}, [el('b',{},['Applicant: ']), req.applicantName+' ('+req.designation+')']),
    el('p', {}, [el('b',{},['Employee no.: ']), req.empNo, '   ', el('b',{},['Department: ']), req.department]),
    el('p', {}, [el('b',{},['Forwarding officer / HOD: ']), req.forwarding]),
    el('p', {}, [el('b',{},['Type of supply: ']), req.supplyType]),
    el('p', {}, [el('b',{},['Purpose: ']), (req.purposes||[]).join(', ') + (req.purposeOther ? ' ('+req.purposeOther+')' : '')]),
    el('p', {}, [el('b',{},['Requirement: ']), req.requirement||'—']),
    el('p', {}, [el('b',{},['Requested period: ']), fmtDate(req.periodFrom)+' → '+fmtDate(req.periodTo)]),
    el('div', {class:'mt-2'}, [el('button', {class:'btn btn-ghost', onclick:()=>downloadPdf(generateTempConnectionPdf(req), `TempConnection_${req.location.replace(/[^a-z0-9]+/gi,'_')}.pdf`)}, ['Re-download PDF'])])
  ]);

  let decisionBlock;
  if(req.status==='Pending'){
    const toggles = {};
    const toggleRows = TC_CHECKLIST_ITEMS.map(c=>{
      const sw = el('button', {type:'button', class:'btn btn-ghost', style:'padding:.3rem .8rem;', onclick:()=>{
        toggles[c.key] = !toggles[c.key];
        sw.textContent = toggles[c.key] ? 'Yes' : 'No';
        sw.style.background = toggles[c.key] ? 'var(--green-l)' : '';
        sw.style.color = toggles[c.key] ? 'var(--green)' : '';
      }}, ['No']);
      toggles[c.key] = false;
      return el('div', {class:'flex items-center justify-between py-2', style:'border-bottom:1px solid var(--line);'}, [el('span',{class:'text-sm'},[c.label]), sw]);
    });
    const slInput = el('input', {value: tcNextSlNo()});
    const techInput = el('input', {placeholder:'Connection given by'});
    const dateInput = el('input', {type:'date', value:new Date().toISOString().slice(0,10)});
    const errBox = el('div', {class:'text-sm', style:'color:var(--red); display:none;'});

    function issue(){
      req.checklist = {...toggles};
      req.slNo = slInput.value.trim() || tcNextSlNo();
      req.technicianName = techInput.value.trim();
      req.connectionDate = dateInput.value;
      req.status = 'Issued';
      req.issuedAt = new Date().toISOString();
      saveState();
      toast('Connection issued.');
      navigate('/temp-connection/approve');
    }
    function reject(){
      const reason = prompt('Reason for rejection (optional):') || '';
      req.status = 'Rejected'; req.rejectReason = reason; req.issuedAt = new Date().toISOString();
      saveState();
      toast('Request rejected.');
      navigate('/temp-connection/approve');
    }

    decisionBlock = el('div', {class:'card p-5 mt-4'}, [
      el('div', {class:'font-head font-bold mb-2'}, ['Safety checklist']),
      ...toggleRows,
      el('div', {class:'grid sm:grid-cols-2 gap-4 mt-4'}, [
        labeled('SL No. of temp. connection register', slInput),
        labeled('Technician name', techInput)
      ]),
      labeled('Connection date', dateInput),
      errBox,
      el('div', {class:'flex gap-2 mt-4'}, [
        el('button', {class:'btn btn-primary', onclick:issue}, ['Issue connection']),
        el('button', {class:'btn btn-danger', onclick:reject}, ['Reject'])
      ])
    ]);
  } else {
    decisionBlock = el('div', {class:'card p-5 mt-4'}, [
      el('div', {class:'font-head font-bold mb-2'}, ['Decision']),
      tcStatusPill(req.status),
      req.status==='Issued'
        ? el('p', {class:'text-sm mt-2'}, [el('b',{},['SL No.: ']), req.slNo||'—', '   ', el('b',{},['Technician: ']), req.technicianName||'—', '   ', el('b',{},['Connection date: ']), fmtDate(req.connectionDate)])
        : (req.rejectReason ? el('p', {class:'text-sm mt-2'}, [el('b',{},['Reason: ']), req.rejectReason]) : null)
    ]);
  }

  shell(el('div', {}, [
    el('a', {href:'#/temp-connection/approve', class:'btn btn-ghost mb-4'}, ['← Back to list']),
    summary,
    decisionBlock
  ]));
});

/* ---- PDF: Temporary Electrical Connection requisition ---- */
function generateTempConnectionPdf(req){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  let y = 50;

  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  const title = 'REQUISITION FOR TEMPORARY ELECTRICAL CONNECTION';
  const tw = doc.getTextWidth(title);
  doc.text(title, pageW/2, y, {align:'center'});
  doc.line(pageW/2-tw/2, y+3, pageW/2+tw/2, y+3);
  y += 34;

  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  const line = (label,val)=>{ doc.text(`${label}: ${val||'—'}`, 45, y); y += 18; };
  line('Location', req.location);
  line('Type of supply', req.supplyType);
  line('Requested period', `${fmtDate(req.periodFrom)} to ${fmtDate(req.periodTo)}`);
  line('Purpose', (req.purposes||[]).join(', ') + (req.purposeOther?' ('+req.purposeOther+')':''));
  line('Requirement', req.requirement);
  y += 6;
  line('Applicant', `${req.applicantName} (${req.designation})`);
  line('Employee no. / Department', `${req.empNo} / ${req.department}`);
  line('Forwarding officer / HOD', req.forwarding);
  y += 10;

  doc.setFont('helvetica','bold'); doc.text('Declaration:', 45, y); y += 16;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  const declLines = [
    'I/We will ensure there is no unauthorised addition or alteration to the temporary supply.',
    'I/We will ensure connected equipment is healthy and properly earthed.',
    'I/We will abide by electrical safety rules and ensure safe working on the temporary connection.',
    'I/We will inform EMD to disconnect immediately after work completion.'
  ];
  declLines.forEach(l=>{ doc.text('• '+l, 50, y); y += 14; });
  y += 20;

  doc.setFontSize(10);
  doc.text('Status: ' + req.status, 45, y); y += 20;
  if(req.status==='Issued'){
    doc.text(`SL No.: ${req.slNo||'—'}   Technician: ${req.technicianName||'—'}   Date: ${fmtDate(req.connectionDate)}`, 45, y);
  } else if(req.status==='Rejected' && req.rejectReason){
    doc.text('Reason: ' + req.rejectReason, 45, y);
  }

  return doc.output('datauristring');
}



function exportExcel(){
  // Simple multi-CSV export bundle (one CSV per sheet/tab in the data model)
  function toCsv(rows){
    if(!rows.length) return '';
    const cols = Object.keys(rows[0]);
    const esc = v => '"' + String(v===undefined||v===null?'':v).replace(/"/g,'""') + '"';
    return cols.join(',') + '\n' + rows.map(r=>cols.map(c=>esc(r[c])).join(',')).join('\n');
  }
  const files = {
    'templates.csv': toCsv(STATE.templates.map(t=>({id:t.id,name:t.name,category:t.category,frequencyDays:t.frequencyDays}))),
    'assets.csv': toCsv(STATE.assets.map(a=>({id:a.id,templateId:a.templateId,createdOn:a.createdOn,...a.fieldValues}))),
    'inspections.csv': toCsv(STATE.inspections.map(i=>({id:i.id,assetId:i.assetId,templateId:i.templateId,date:i.date,inspector:i.inspector,oneDriveUrl:i.oneDriveUrl||''})))
  };
  Object.entries(files).forEach(([name, content])=>{
    if(!content) return;
    const blob = new Blob([content], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
  });
  toast('Exported CSVs for templates, assets, and inspections.');
}

function openAssetForm(t, existing){

    } else if(f.type==='textarea'){
      input = el('textarea', {rows:'3'}, [values[f.key]||'']);
    } else {
      input = el('input', {type: f.type==='date'?'date':(f.type==='number'?'number':'text'), value: values[f.key]||''});
    }
    inputs[f.key] = input;
    fieldsNode.appendChild(labeled(f.label + (f.required?' *':''), input));

      el('button', {class:'btn btn-ghost', onclick:()=>bg.remove()}, ['Cancel']),
      el('button', {class:'btn btn-primary', onclick:()=>{
        const fv = {};
        t.assetFields.forEach(f=> fv[f.key] = inputs[f.key].value);
        const missing = t.assetFields.filter(f=>f.required && !fv[f.key]);
        if(missing.length){ toast('Please fill: ' + missing.map(f=>f.label).join(', ')); return; }
        if(existing){ existing.fieldValues = fv; }
        else { STATE.assets.push({ id: uid('a'), templateId: t.id, createdOn: new Date().toISOString(), fieldValues: fv }); }
        saveState(); bg.remove(); render();
        toast(existing ? 'Asset updated.' : 'Asset added.');
      }}, [existing ? 'Save' : 'Add asset'])
    ])
  ]);
  bg.appendChild(box); document.body.appendChild(bg);
}

/* ============================================================
   INSPECTION MODAL — opens over any page (Asset List, Asset
   Detail, Reminders). Mirrors the compact inspection dialog style.
   ============================================================ */
function openInspectionModal(t, a){
  const dateInput = el('input', {type:'date', value: new Date().toISOString().slice(0,10)});
  const deptInput = el('input', {value:a.fieldValues.department||''});
  const areaInput = el('input', {value:a.fieldValues.area||''});
  const contractorInput = el('input', {value:a.fieldValues.contractor||''});
  const inspectorInput = el('input', {placeholder:'Inspector name'});
  const obsInput = el('textarea', {rows:'2'});
  const correctiveInput = el('textarea', {rows:'2'});
  const inspSigInput = el('input', {type:'file', accept:'image/*'});
  const contSigInput = el('input', {type:'file', accept:'image/*'});
  const photoInput = el('input', {type:'file', accept:'image/*'});

  const answers = {};
  const itemRows = t.checklistItems.map(it=>{
    let responseNode;
    const isRequiredRemark = it.requiresRemark==='always';
    const remarkInput = el('input', {
      placeholder: 'Remarks' + (isRequiredRemark ? ' *' : ''),
      style: isRequiredRemark ? 'border-color:#ff3e1d; background:#fff2ef;' : ''
    });
    function setAnswer(v){ answers[it.no] = answers[it.no]||{}; answers[it.no].answer = v; }
    if(it.responseType==='yes_no_na' || it.responseType==='pass_fail'){
      const opts = it.responseType==='yes_no_na' ? ['Yes','No','N/A'] : ['Pass','Fail'];
      responseNode = el('div', {class:'radio-group flex gap-2 flex-wrap'}, opts.map(o=>{
        const radio = el('input', {type:'radio', name:'item'+it.no, value:o, onchange:()=>setAnswer(o)});
        return el('label', {}, [radio, el('span',{},[o])]);
      }));
    } else if(it.responseType==='rating_1_5'){
      responseNode = el('div', {class:'radio-group flex gap-2'}, [1,2,3,4,5].map(n=>{
        const radio = el('input', {type:'radio', name:'item'+it.no, value:String(n), onchange:()=>setAnswer(String(n))});
        return el('label', {}, [radio, el('span',{},[String(n)])]);
      }));
    } else {
      responseNode = el('input', {type: it.responseType==='number'?'number':'text', oninput:(e)=>setAnswer(e.target.value)});
    }
    answers[it.no] = { answer:'', remark:'' };
    remarkInput.addEventListener('input', ()=>{
      answers[it.no].remark = remarkInput.value;
      if(isRequiredRemark){ remarkInput.style.borderColor = remarkInput.value ? '' : '#ff3e1d'; remarkInput.style.background = remarkInput.value ? '' : '#fff2ef'; }
    });
    const descNode = isRequiredRemark
      ? el('span', {}, [it.description, el('span', {style:'color:#ff3e1d; font-weight:700;'}, [' *'])])
      : it.description;
    return [String(it.no), descNode, responseNode, it.requiresRemark==='never' ? '' : remarkInput];
  });

  function buildInspectionObj(){
    return {
      id: uid('insp'), assetId: a.id, templateId: t.id,
      date: dateInput.value, department: deptInput.value, area: areaInput.value,
      contractor: contractorInput.value, inspector: inspectorInput.value,
      observations: obsInput.value, correctiveActions: correctiveInput.value,
      answers: t.checklistItems.map(it=> ({ itemNo: it.no, description: it.description, answer: (answers[it.no]||{}).answer||'', remark: (answers[it.no]||{}).remark||'' })),
      inspectorSignature: null, inspectorSigDims: null,
      contractorSignature: null, contractorSigDims: null,
      photo: null, photoDims: null,
      oneDriveUrl: ''
    };
  }

  async function submit(){
    if(!dateInput.value){ toast('Date is required.'); return; }
    if(t.requireInspectorSig && !inspSigInput.files[0]){ toast('Inspector signature is required.'); return; }
    if(t.requireContractorSig && !contSigInput.files[0]){ toast('Contractor signature is required.'); return; }
    if(t.requirePhoto && !photoInput.files[0]){ toast('Photo evidence is required.'); return; }
    const missingRemarks = t.checklistItems.filter(it=>{
      const ans = answers[it.no]||{};
      return it.requiresRemark==='always' && !ans.remark;
    });
    if(missingRemarks.length){
      toast('Please add a remark for: ' + missingRemarks.map(m=>'#'+m.no+' '+m.description).join('; '), {duration:6000});
      const box = document.querySelector('.insp-modal-body');
      if(box) box.scrollTop = 0;
      return;
    }

    const insp = buildInspectionObj();

    // Read the uploaded signature/photo files and pre-measure their aspect ratio so
    // the PDF can embed them properly instead of just leaving a blank line.
    const [inspSigData, contSigData, photoData] = await Promise.all([
      readFileAsDataURL(inspSigInput.files[0]),
      readFileAsDataURL(contSigInput.files[0]),
      readFileAsDataURL(photoInput.files[0])
    ]);
    if(inspSigData){ insp.inspectorSignature = inspSigData; insp.inspectorSigDims = await loadImageDims(inspSigData); }
    if(contSigData){ insp.contractorSignature = contSigData; insp.contractorSigDims = await loadImageDims(contSigData); }
    if(photoData){ insp.photo = photoData; insp.photoDims = await loadImageDims(photoData); }

    if(!window.jspdf || !window.jspdf.jsPDF){
      toast('PDF library failed to load (check your internet connection) — saving the inspection anyway. Use "Re-download PDF" from the asset history once the page can reach the internet.', {duration:8000});
      STATE.inspections.push(insp);
      saveState();
      bg.remove();
      render();
      return;
    }

    let pdfDataUri = null;
    try{
      pdfDataUri = generatePDF(t, a, insp);
    }catch(err){
      toast('PDF generation failed (' + err.message + ') — the inspection was still saved. Try "Re-download PDF" from the asset history.', {duration:8000});
      STATE.inspections.push(insp);
      saveState();
      bg.remove();
      render();
      return;
    }

    if(CONFIG.GAS_URL){
      try{
        const resp = await fetch(CONFIG.GAS_URL, { method:'POST', body: new URLSearchParams({
          action:'uploadFile', fileName:`${t.name}_${insp.date}_${a.fieldValues[t.assetFields[0].key]||a.id}.pdf`,
          mimeType:'application/pdf', subfolderName:t.name, base64: pdfDataUri.split(',')[1]
        })});
        const j = await resp.json();
        insp.oneDriveUrl = j.url || '';
      }catch(e){ /* offline fallback below */ }
    }
    STATE.inspections.push(insp);
    saveState();
    downloadPdf(pdfDataUri, `${t.name}_${insp.date}.pdf`);
    bg.remove();
    toast('Inspection saved' + (insp.oneDriveUrl ? ' and uploaded to OneDrive.' : ' — PDF downloaded locally.'));
    render();
  }

  const checklistTable = gridTable(
    [
      {label:'#', width:'4%'},
      {label:'Description', width:'32%'},
      {label:'Yes / No / N/A', width:'36%'},
      {label:'Remarks', width:'28%'}
    ],
    itemRows.map(r=> [
      el('span', {class:'text-slate-400'}, [r[0]]),
      r[1],
      r[2],
      r[3]
    ]),
    {dividers:true}
  );

  const bg = el('div', {class:'modal-bg', style:'align-items:flex-start; padding-top:3vh;'});
  const box = el('div', {class:'insp-modal-box'}, [
    el('div', {class:'insp-modal-header'}, [
      el('div', {}, [
        el('div', {class:'text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1'}, [t.pdfTitle || t.name]),
        el('h3', {class:'font-head text-lg font-bold'}, ['Inspection — ' + (a.fieldValues[t.assetFields[0].key] || a.id)])
      ]),
      el('button', {class:'text-slate-400 hover:text-slate-700 text-xl leading-none', onclick:()=>bg.remove()}, ['✕'])
    ]),
    el('div', {class:'insp-modal-body'}, [
      el('div', {class:'card p-4 mb-4', style:'background:#f8fafc'}, [
        el('div', {class:'grid sm:grid-cols-3 gap-3'}, t.assetFields.map(f=>
          el('div', {}, [
            el('div', {class:'text-xs font-semibold text-slate-400 uppercase tracking-wide'}, [f.label]),
            el('div', {class:'font-semibold text-sm'}, [String(a.fieldValues[f.key]||'—')])
          ])
        ))
      ]),
      el('div', {class:'grid sm:grid-cols-2 gap-4 mb-4'}, [
        labeled('Inspection Date *', dateInput), labeled('Department / Section', deptInput)
      ]),
      el('div', {class:'grid sm:grid-cols-3 gap-4 mb-4'}, [
        labeled('Area', areaInput), labeled('Contractor / Agency', contractorInput), labeled('Inspector name', inspectorInput)
      ]),
      el('div', {class:'mb-4'}, [
        el('div', {class:'field-label mb-2'}, ['Inspection checklist']),
        el('div', {class:'overflow-x-auto border border-slate-200 rounded-xl'}, [checklistTable])
      ]),
      el('div', {class:'grid sm:grid-cols-2 gap-4 mb-4'}, [
        labeled('Observations', obsInput), labeled('Corrective actions', correctiveInput)
      ]),
      el('div', {class:'grid sm:grid-cols-3 gap-4'}, [
        t.requireInspectorSig ? labeled('Inspector signature *', inspSigInput) : null,
        t.requireContractorSig ? labeled('Contractor signature *', contSigInput) : null,
        t.requirePhoto ? labeled('Photo evidence *', photoInput) : null
      ])
    ]),
    el('div', {class:'insp-modal-footer', style:'justify-content:flex-end;'}, [
      el('div', {class:'flex gap-2'}, [
        el('button', {class:'btn btn-ghost', onclick:()=>bg.remove()}, ['Cancel']),
        el('button', {class:'btn btn-primary', onclick:submit}, ['Save & Generate PDF'])
      ])
    ])
  ]);
  bg.appendChild(box);
  document.body.appendChild(bg);
}

// Deep-link support: #/inspect/:assetId opens the asset detail page underneath, then
// pops the inspection modal on top of it.
route('/inspect/:assetId', ({params})=>{
  if(!hasRole('user')){ toast('You need User access to record inspections.'); navigate('/checklist'); return; }
  const a = STATE.assets.find(x=>x.id===params.assetId);
  if(!a){ navigate('/templates'); return; }
  const t = STATE.templates.find(x=>x.id===a.templateId);
  navigate('/assets/'+t.id+'/'+a.id);
  setTimeout(()=>openInspectionModal(t,a), 0);
});

/* ============================================================
   PDF GENERATION (jsPDF)
   ============================================================ */
function generatePDF(t, a, insp){
  if(t.id === 't_ppe') return generatePpePdf(t, a, insp);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  let y = 40;

  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text(t.pdfTitle || t.name, pageW/2, y, {align:'center'}); y+=24;

  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text(`Department / Section: ${insp.department||'—'}`, 40, y);
  doc.text(`Area: ${insp.area||'—'}`, 40+240, y);
  doc.text(`Date: ${fmtDate(insp.date)}`, 40+400, y);
  y += 16;
  doc.text(`Contractor/Agency: ${insp.contractor||'—'}`, 40, y); y += 16;
  doc.text(`${t.assetFields[0].label}: ${a.fieldValues[t.assetFields[0].key]||'—'}`, 40, y); y += 16;
  y += 8;

  // Bordered checklist table (outer box + inner column/row rules)
  const tableLeft = 40, tableRight = pageW-40;
  const tw = tableRight-tableLeft;
  const colW = { no: 26, resp: 85, remark: 115 };
  colW.desc = tw - colW.no - colW.resp - colW.remark;
  const colX = { no: tableLeft, desc: tableLeft+colW.no, resp: tableLeft+colW.no+colW.desc, remark: tableLeft+colW.no+colW.desc+colW.resp };
  const vlines = [tableLeft, colX.desc, colX.resp, colX.remark, tableRight];

  function drawTableHeaderRow(startY){
    const h = 20;
    doc.setFont('helvetica','bold'); doc.setFontSize(9);
    doc.setLineWidth(0.75);
    doc.line(tableLeft, startY, tableRight, startY);
    doc.line(tableLeft, startY+h, tableRight, startY+h);
    vlines.forEach(x=> doc.line(x, startY, x, startY+h));
    doc.text('#', colX.no+5, startY+14);
    doc.text('Description', colX.desc+5, startY+14);
    doc.text('Response', colX.resp+5, startY+14);
    doc.text('Remark', colX.remark+5, startY+14);
    doc.setFont('helvetica','normal');
    return startY+h;
  }

  y = drawTableHeaderRow(y);

  insp.answers.forEach(row=>{
    const descLines = doc.splitTextToSize(row.description, colW.desc-10);
    const remarkLines = doc.splitTextToSize(row.remark||'', colW.remark-10);
    const lineCount = Math.max(descLines.length, remarkLines.length, 1);
    const rowH = lineCount*11 + 8;
    if(y + rowH > 780){
      doc.addPage(); y = 40;
      y = drawTableHeaderRow(y);
    }
    const rowTop = y, rowBottom = y+rowH;
    doc.setLineWidth(0.5);
    vlines.forEach(x=> doc.line(x, rowTop, x, rowBottom));
    doc.line(tableLeft, rowBottom, tableRight, rowBottom);
    doc.text(String(row.itemNo), colX.no+5, rowTop+12);
    doc.text(descLines, colX.desc+5, rowTop+12);
    doc.text(String(row.answer||'—'), colX.resp+5, rowTop+12);
    doc.text(remarkLines, colX.remark+5, rowTop+12);
    y = rowBottom;
  });
  y += 20;

  if(y>700){ doc.addPage(); y=40; }
  doc.setFont('helvetica','bold'); doc.text('Observations:', 40, y); y+=12;
  doc.setFont('helvetica','normal');
  doc.text(doc.splitTextToSize(insp.observations||'—', pageW-80), 40, y); y+=28;

  doc.setFont('helvetica','bold'); doc.text('Corrective Actions:', 40, y); y+=12;
  doc.setFont('helvetica','normal');
  doc.text(doc.splitTextToSize(insp.correctiveActions||'—', pageW-80), 40, y); y+=28;

  if(y>700){ doc.addPage(); y=40; }
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  if(t.requireInspectorSig){
    doc.text('Inspected by / Signature:', 40, y);
    y = placeSignature(doc, insp.inspectorSignature, insp.inspectorSigDims, 175, y);
  }
  if(y>760){ doc.addPage(); y=40; }
  if(t.requireContractorSig){
    doc.text('Contractor (Name, Signature, Date):', 40, y);
    y = placeSignature(doc, insp.contractorSignature, insp.contractorSigDims, 225, y);
  }
  if(y>760){ doc.addPage(); y=40; }
  doc.setFont('helvetica','normal');
  doc.text('Inspector: ' + (insp.inspector||'—'), 40, y);

  appendPhotoPage(doc, insp);
  return doc.output('datauristring');
}

// Draws a signature image inline next to a label (or a blank underscore line if none
// was uploaded), and returns the y position for the next line.
function placeSignature(doc, dataUrl, dims, x, y){
  if(dataUrl){
    try{
      const size = fitDims(dims, 190, 64); // at least 3 checklist-row-heights tall
      doc.addImage(dataUrl, pdfImageFormat(dataUrl), x, y-50, size.w, size.h);
    }catch(e){ doc.text('______________________', x, y); }
  } else {
    doc.text('______________________', x, y);
  }
  return y + 76;
}
// Appends a dedicated page with the uploaded photo evidence, scaled to fit and
// centered, only when a photo was actually provided.
function appendPhotoPage(doc, insp){
  if(!insp.photo) return;
  doc.addPage();
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('Photo Evidence', 40, 40);
  try{
    const size = fitDims(insp.photoDims, pageW-80, pageH-100);
    const x = (pageW - size.w)/2;
    doc.addImage(insp.photo, pdfImageFormat(insp.photo), x, 60, size.w, size.h);
  }catch(e){ /* skip if the image can't be decoded */ }
}

// Reconstructs per-PPE-item rows (PPE name / quantity / condition / remarks) from the
// paired "X — Quantity available" + "X — Condition" checklist answers.
function buildPpeRows(insp){
  const map = {};
  const order = [];
  insp.answers.forEach(ans=>{
    const m = ans.description.match(/^(.*)\s+—\s+(Quantity available|Condition)$/);
    if(!m) return;
    const base = m[1].trim();
    if(!map[base]){ map[base] = {ppe:base, quantity:'', condition:'', remarks:''}; order.push(base); }
    if(m[2]==='Quantity available'){ map[base].quantity = ans.answer || ''; }
    else { map[base].condition = ans.answer || ''; if(ans.remark) map[base].remarks = ans.remark; }
  });
  return order.map(b=>map[b]);
}

// Matches the original "QUARTERLY INSPECTION OF PPE" paper form layout: centered
// underlined title, header fields, a bordered # / PPE / Quantity / Condition / Remarks
// table, observations line, inspected-by / area engineer block, numbered corrective
// actions, and a contractor sign-off line — no doc-code or page-number footer.
function generatePpePdf(t, a, insp){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  const marginL = 45, marginR = 45;
  const usableW = pageW - marginL - marginR;
  let y = 50;

  // Title, centered + underlined
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  const title = t.pdfTitle || t.name;
  const titleW = doc.getTextWidth(title);
  doc.text(title, pageW/2, y, {align:'center'});
  doc.setLineWidth(0.7);
  doc.line(pageW/2 - titleW/2, y+3, pageW/2 + titleW/2, y+3);
  y += 34;

  // Header fields
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text(`Department / Section: ${insp.department||''}`, marginL, y);
  doc.text(`Area: ${insp.area||''}`, marginL+280, y);
  doc.text(`Date: ${fmtDate(insp.date)}`, marginL+420, y);
  y += 20;
  doc.text(`Contractor/Agency: ${insp.contractor||''}`, marginL, y); y += 20;
  doc.text(`Inspected by: ${insp.inspector||''}`, marginL, y); y += 30;

  // Table
  const rows = buildPpeRows(insp);
  const totalRows = Math.max(rows.length, 15);
  const colW = { no:26, ppe:150, qty:95, cond:95 };
  colW.remarks = usableW - colW.no - colW.ppe - colW.qty - colW.cond;
  const rowH = 20;
  const tableTop = y;
  const colX = {
    no: marginL,
    ppe: marginL + colW.no,
    qty: marginL + colW.no + colW.ppe,
    cond: marginL + colW.no + colW.ppe + colW.qty,
    remarks: marginL + colW.no + colW.ppe + colW.qty + colW.cond
  };
  const tableBottom = tableTop + rowH * (totalRows + 1);

  doc.setLineWidth(0.75);
  // outer + column verticals
  [colX.no, colX.ppe, colX.qty, colX.cond, colX.remarks, marginL+usableW].forEach(x=>{
    doc.line(x, tableTop, x, tableBottom);
  });
  // row horizontals
  for(let i=0;i<=totalRows+1;i++){
    const ry = tableTop + i*rowH;
    doc.line(marginL, ry, marginL+usableW, ry);
  }

  // header row labels
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  const headerY = tableTop + rowH/2 + 3;
  doc.text('#', colX.no+8, headerY);
  doc.text('PPE', colX.ppe+6, headerY);
  doc.text('QUANTITY', colX.qty+6, headerY);
  doc.text('CONDITION', colX.cond+6, headerY);
  doc.text('REMARKS', colX.remarks+6, headerY);

  // data rows
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  for(let i=0;i<totalRows;i++){
    const r = rows[i];
    const cy = tableTop + rowH*(i+2) - rowH/2 + 3;
    doc.text(String(i+1), colX.no+8, cy);
    if(r){
      doc.text(String(r.ppe||''), colX.ppe+6, cy);
      doc.text(String(r.quantity||''), colX.qty+6, cy);
      doc.text(String(r.condition||''), colX.cond+6, cy);
      doc.text(doc.splitTextToSize(String(r.remarks||''), colW.remarks-10), colX.remarks+6, cy);
    }
  }
  y = tableBottom + 34;

  // Observations
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text('Additional Observations, incl. positives & penal actions taken:', marginL, y); y += 16;
  const obsLines = doc.splitTextToSize(insp.observations || '', usableW);
  if(obsLines.length){ doc.text(obsLines, marginL, y); y += obsLines.length*13; }
  doc.setDrawColor(150); doc.line(marginL, y, marginL+usableW, y); y += 26;

  doc.setFont('helvetica','bold');
  doc.text('INSPECTED BY:', marginL, y); y += 20;
  doc.setFont('helvetica','normal');
  doc.text(`NTPC AREA ENGINEER/EIC/HOS (Name & Signature): ${insp.inspector||''}`, marginL, y);
  y = placeSignature(doc, insp.inspectorSignature, insp.inspectorSigDims, marginL+320, y) - 10;
  y += 20;

  doc.setFont('helvetica','bold');
  doc.text('Corrective Actions completed:', marginL, y); y += 18;
  doc.setFont('helvetica','normal');
  const actions = (insp.correctiveActions||'').split('\n').map(s=>s.trim()).filter(Boolean);
  for(let i=0;i<3;i++){
    doc.text(`${i+1} ${actions[i] ? '- ' + actions[i] : '--------'}`, marginL, y);
    y += 18;
  }
  y += 12;

  doc.setFont('helvetica','bold');
  doc.text(`CONTRACTOR (Name, Signature, Date): ${insp.contractor||''}`, marginL, y);
  placeSignature(doc, insp.contractorSignature, insp.contractorSigDims, marginL+320, y);

  appendPhotoPage(doc, insp);
  return doc.output('datauristring');
}
function downloadPdf(dataUri, filename){
  const a = document.createElement('a');
  a.href = dataUri; a.download = filename; a.click();
}
function regeneratePdf(t,a,insp){
  const uri = generatePDF(t,a,insp);
  downloadPdf(uri, `${t.name}_${insp.date}.pdf`);
}

/* ============================================================
   RENDER DISPATCH
   ============================================================ */
function render(){
  if(!currentUser()){ renderLogin(); return; }
  const r = currentRoute();
  if(r) r.handler(r);
  else { location.hash = '/'; routes['/']({params:{}}); }
}
