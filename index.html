<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Safety Compliance Module</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2/lib/msal-browser.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">
<style>
  :root{
    /* Design tokens re-themed to match the NTPC login illustration (deep signal-blue brand
       colour + slate-navy ink), replacing the original Sneat purple. */
    --ink:#243347; --sub:#75808f; --line:#e6e9ee; --card:#fff; --bg:#f5f7fb;
    --sidebar-w:260px;
    /* primary = NTPC brand blue sampled from the login artwork (#0c4fc0) */
    --sky:#0c4fc0; --sky-l:#e4ecfa;
    --indigo:#0c4fc0; --indigo-l:#e4ecfa;
    --amber:#a36400; --amber-l:#fff3d6;      /* warning, readable text tint */
    --green:#3a8a1a; --green-l:#e8f9e0;      /* success, readable text tint */
    --red:#c92c12; --red-l:#ffe4df;          /* danger, readable text tint */
    --info:#0c4fc0; --info-l:#e4ecfa;        /* info matches brand blue */
    --shadow-sm:0 .125rem .375rem 0 rgba(12,53,110,.08);
    --shadow:0 .1875rem .5rem 0 rgba(12,53,110,.12);
  }
  *,*::before,*::after{box-sizing:border-box;}
  *{font-family:'Public Sans',-apple-system,'Segoe UI',sans-serif;}
  a{text-decoration:none; color:inherit;}
  h1,h2,h3,h4,.font-head{font-family:'Public Sans',sans-serif; font-weight:700;}
  body{background:var(--bg); color:var(--ink);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:.625rem; box-shadow:var(--shadow-sm); transition:box-shadow .18s ease, transform .18s ease;}
  .card:hover{box-shadow:var(--shadow);}
  .btn{display:inline-flex; align-items:center; gap:.4rem; font-weight:500; border-radius:.375rem; padding:.5rem 1rem; transition:background-color .15s ease, transform .1s ease, box-shadow .15s ease; font-size:.875rem; cursor:pointer; border:none;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:#0c4fc0; color:#fff; box-shadow:0 .125rem .25rem 0 rgba(12,79,192,.4);} .btn-primary:hover{background:#0a3f9c;}
  .btn-ghost{background:#fff; border:1px solid var(--line); color:var(--ink);} .btn-ghost:hover{background:#f7f7f9;}
  .btn-danger{background:var(--red-l); color:var(--red);} .btn-danger:hover{background:#ffd4cb;}
  .btn-indigo{background:#0c4fc0; color:#fff;} .btn-indigo:hover{background:#0a3f9c;}
  .btn-success{background:#71dd37; color:#fff; box-shadow:0 .125rem .25rem 0 rgba(113,221,55,.4);} .btn-success:hover{background:#64c72f;}
  input,select,textarea{border:1px solid var(--line); border-radius:.375rem; padding:.5rem .8rem; font-size:.875rem; width:100%; background:#fff; color:var(--ink);}
  input:focus,select:focus,textarea:focus{outline:none; border-color:#0c4fc0; box-shadow:0 .125rem .25rem 0 rgba(12,79,192,.4);}
  .field-invalid{border-color:var(--red) !important; box-shadow:0 0 0 1px var(--red) inset;}
  .field-invalid-group{border:1px solid var(--red) !important; border-radius:.5rem; padding:.5rem; margin:-.5rem -.5rem 0;}
  label.field-label{font-size:.75rem; font-weight:600; color:var(--sub); text-transform:uppercase; letter-spacing:.03em; margin-bottom:.25rem; display:block;}
  .pill{display:inline-flex; align-items:center; gap:.3rem; font-size:.7rem; font-weight:600; padding:.25rem .65rem; border-radius:50rem; letter-spacing:.02em; transition:background-color .2s ease, color .2s ease;}
  .status-ok{background:var(--green-l); color:var(--green);}
  .status-warn-30{background:var(--amber-l); color:var(--amber);}
  .status-danger{background:var(--red-l); color:var(--red);}
  .status-none{background:#eceef0; color:var(--sub);}
  .page-wrap{max-width:1680px; margin-left:auto; margin-right:auto;}
  /* Grid-table system: every row (including the header) is an independent CSS Grid
     with an IDENTICAL grid-template-columns string, so header and data columns are
     structurally forced to align — this avoids relying on HTML <table> column layout,
     which can behave inconsistently across browser/webview engines. */
  .grid-table{width:100%; font-size:.88rem;}
  .gt-row{display:grid; align-items:stretch;}
  .gt-row.gt-head{background:#f7f7f9;}
  .gt-row:not(.gt-head){border-bottom:1px solid var(--line); transition:background-color .12s ease;}
  .gt-row:not(.gt-head):hover{background:#fbfbfc;}
  .gt-cell{padding:.9rem 1.5rem; display:flex; align-items:center; overflow:hidden; min-width:0;}
  .gt-cell.wrap{white-space:normal; overflow-wrap:break-word;}
  .grid-table.gt-dividers .gt-cell{border-right:1px solid var(--line);}
  .grid-table.gt-dividers .gt-cell:last-child{border-right:none;}
  .gt-head .gt-cell{padding:1rem 1.5rem; font-weight:700; font-size:.72rem; letter-spacing:.04em; text-transform:uppercase; color:var(--sub); border-bottom:1px solid var(--line); white-space:nowrap;}
  .gt-cell.text-right{justify-content:flex-end; text-align:right;}
  .badge-count{display:inline-flex; align-items:center; font-size:.78rem; font-weight:600; padding:.25rem .7rem; border-radius:50rem; background:var(--green-l); color:var(--green);}
  .insp-modal-box{background:#fff; border-radius:.625rem; max-width:1040px; width:100%; max-height:92vh; display:flex; flex-direction:column; overflow:hidden; animation:slideUp .18s ease;}
  .insp-modal-header{padding:1.1rem 1.5rem .9rem; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; justify-content:space-between; gap:1rem;}
  .insp-modal-body{overflow-y:auto; padding:1.25rem 1.5rem;}
  .insp-modal-footer{border-top:1px solid var(--line); padding:.9rem 1.5rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;}
  .group-banner{background:#e4ecfa; border-left:3px solid #0c4fc0; padding:.75rem 1.1rem; border-radius:.5rem; margin-bottom:.75rem;}
  [id^="grp-"]{scroll-margin-top:24px;}
  .role-chip{font-size:.7rem; font-weight:700; padding:.2rem .55rem; border-radius:50rem; text-transform:uppercase; letter-spacing:.03em;}
  .role-admin{background:var(--indigo-l); color:#0c4fc0;}
  .role-user{background:var(--info-l); color:var(--info);}
  .role-viewer{background:#eceef0; color:var(--sub);}
  .modal-bg{position:fixed; inset:0; background:rgba(34,48,62,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:1rem; animation:fadeIn .15s ease;}
  .modal-box{background:#fff; border-radius:.625rem; max-width:640px; width:100%; max-height:90vh; overflow:auto; animation:slideUp .18s ease;}
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  @keyframes slideUp{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
  @keyframes pageIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
  @keyframes toastIn{from{opacity:0; transform:translate(-50%,12px)} to{opacity:1; transform:translate(-50%,0)}}
  .page-fade{animation:pageIn .22s ease;}
  .toast{position:fixed; bottom:1.25rem; left:50%; transform:translateX(-50%); background:#2b2c40; color:#fff; padding:.7rem 1.1rem; border-radius:.5rem; font-size:.85rem; z-index:100; display:flex; gap:.75rem; align-items:center; box-shadow:var(--shadow-lg,0 .25rem .75rem rgba(34,48,62,.3)); animation:toastIn .2s ease;}
  .radio-group{display:flex; flex-wrap:nowrap !important; align-items:center;}
  .radio-group label{display:inline-flex; align-items:center; gap:.3rem; border:1px solid var(--line); padding:.35rem .55rem; border-radius:.375rem; cursor:pointer; font-size:.8rem; font-weight:500; white-space:nowrap !important; word-break:normal !important; overflow-wrap:normal !important; flex:0 0 auto;}
  .radio-group input:checked + span{font-weight:700;}
  .radio-group label:has(input:checked){border-color:#0c4fc0; background:var(--sky-l);}
  .drag-handle{cursor:grab; color:#bdc1c5;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:1rem;}
  @media (max-width:640px){ .row2{grid-template-columns:1fr;} }
  .nav-link{padding:.4rem .8rem; border-radius:.375rem; font-weight:600; font-size:.82rem; color:var(--sub); background:#f7f7f9; transition:background-color .15s ease, color .15s ease; display:inline-flex; align-items:center;}
  .nav-link:hover{background:#e4ecfa; color:#0c4fc0;}
  ::-webkit-scrollbar{width:8px; height:8px;} ::-webkit-scrollbar-thumb{background:#bdc1c5; border-radius:8px;}

  /* ===== Sneat-style layout shell: fixed left sidebar + slim top navbar ===== */
  .sneat-sidebar{position:fixed; top:0; left:0; bottom:0; width:var(--sidebar-w); background:#fff; border-right:1px solid var(--line); z-index:40; display:flex; flex-direction:column; overflow-y:auto;}
  .sneat-brand{display:flex; align-items:center; gap:.6rem; padding:1.35rem 1.5rem; flex-shrink:0;}
  .sneat-brand .brand-icon{width:34px; height:34px; border-radius:.5rem; background:#0c4fc0; color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex-shrink:0;}
  .sneat-brand .brand-text{font-weight:700; font-size:1.05rem; color:var(--ink); line-height:1.1;}
  .sneat-brand .brand-sub{font-size:.68rem; color:var(--sub); font-weight:500;}
  .sneat-menu{padding:.5rem .75rem 1.5rem; flex:1;}
  .sneat-menu-label{font-size:.68rem; font-weight:700; color:#bdc1c5; text-transform:uppercase; letter-spacing:.04em; padding:1rem .75rem .35rem;}
  .sneat-menu-link{display:flex; align-items:center; gap:.7rem; padding:.6rem .75rem; border-radius:.375rem; color:#5f6b7a; font-weight:500; font-size:.9rem; margin-bottom:.15rem; transition:background-color .15s ease, color .15s ease;}
  .sneat-menu-link i{font-size:1.15rem; flex-shrink:0;}
  .sneat-menu-link:hover{background:#f7f7f9; color:var(--ink);}
  .sneat-menu-link.active{background:#0c4fc0; color:#fff; box-shadow:0 .125rem .375rem 0 rgba(12,79,192,.45);}
  .sneat-menu-link.active i{color:#fff;}
  .sneat-main{margin-left:var(--sidebar-w);}
  .sneat-navbar{background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30;}
  @media (max-width:900px){
    .sneat-sidebar{transform:translateX(-100%); transition:transform .2s ease;}
    .sneat-sidebar.open{transform:translateX(0); box-shadow:var(--shadow);}
    .sneat-main{margin-left:0;}
  }

  /* ===== Login page: background illustration with overlaid sign-in card =====
     login_bg.jpg is the supplied artwork (SAFETY COMPLIANCE MODULE illustration
     with logo/"WELCOME BACK"/"Sign in to continue" baked in, and a blank white
     card area on the right). We size a wrapper to the image's exact 1536x1024
     aspect ratio so the live form fields we overlay always land inside that
     blank card, at any viewport width. All overlay metrics use cqw so they
     scale together with the wrapper. */
  .login-page-bg{min-height:100vh; background:#f4f5f7; display:flex; align-items:center; justify-content:center; padding:24px;}
  /* Card shell that floats the (now smaller) artwork+form above the plain
     gray page background, like a drop-shadowed playing card. */
  .login-card-shell{position:relative; width:100%; max-width:1106px; margin:0 auto; background:#fff; border-radius:1.1rem;
    box-shadow:0 1.75rem 3.5rem rgba(15,23,42,.20), 0 .375rem 1rem rgba(15,23,42,.10); padding:14px; overflow:hidden;}
  .login-wrap{position:relative; width:100%; max-width:1106px; margin:0 auto; container-type:inline-size;}
  .login-wrap>img{display:block; width:100%; height:auto; border-radius:.7rem;}
  .login-card{position:absolute; left:58.3%; top:12.3%; width:34.6%; height:73.9%; box-sizing:border-box;
    display:flex; flex-direction:column; justify-content:flex-end; gap:1.5cqw; padding:0 4.6cqw 9cqw;}
  .login-field{position:relative; display:flex; align-items:center; gap:.9cqw; background:#fff; border:1px solid #d7dbe3; border-radius:0.7cqw;
    padding:0 1.1cqw; height:6.2cqw; max-height:44px;}
  .login-field svg{flex-shrink:0; width:1.3cqw; height:1.3cqw; min-width:14px; min-height:14px; max-width:18px; max-height:18px; color:#8a94a3;}
  .login-field input{border:none; outline:none; flex:1; min-width:0; width:100%; padding:0; margin:0; font-size:1.02cqw; line-height:1.2; font-family:inherit; color:#1e293b; background:transparent; height:100%;}
  .login-field input::placeholder{color:#9aa3b0;}
  .login-field .eye-toggle{background:none; border:none; padding:0; cursor:pointer; color:#8a94a3; display:flex; flex-shrink:0;}
  .login-row{display:flex; align-items:center; justify-content:space-between; font-size:.95cqw;}
  .login-row label{display:flex; align-items:center; gap:.5cqw; color:#334155; cursor:pointer; font-size:.95cqw;}
  .login-row input[type=checkbox]{width:1.1cqw; height:1.1cqw; min-width:12px; min-height:12px; max-width:15px; max-height:15px; accent-color:#0c4fc0; cursor:pointer;}
  .login-row a{color:#0c4fc0; font-weight:600; text-decoration:none; font-size:.95cqw;}
  .login-row a:hover{text-decoration:underline;}
  .login-btn{background:#0c4fc0; color:#fff; border:none; border-radius:0.7cqw; height:6.2cqw; max-height:44px; font-weight:700; font-size:1.05cqw;
    letter-spacing:.04em; cursor:pointer; transition:background-color .15s ease;}
  .login-btn:hover{background:#0a3f9c;}
  .login-error{color:#dc2626; font-size:.9cqw; margin:0;}
  .login-demo{max-width:1106px; margin:18px auto 0; padding:0 24px;}

  /* ===== Infographic-style pie (dashboard: due-date status) ===== */
  .infographic-pie-wrap{display:flex; align-items:center; justify-content:center; height:220px;}
  .infographic-pie-inner{position:relative; width:210px; height:210px;}
  .infographic-pie{position:relative; width:100%; height:100%; border-radius:50%; overflow:hidden; box-shadow:0 12px 26px rgba(20,40,60,0.18), inset 0 0 0 6px #fff;}
  .infographic-pie-separator{position:absolute; left:50%; top:50%; width:50%; height:2px; transform-origin:0 50%; background:#fff; border-radius:1px; z-index:2; pointer-events:none; opacity:0;}
  .infographic-pie-label{position:absolute; transform:translate(-50%,-50%); text-align:center; color:#fff; pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,0.25); z-index:3;}
  .infographic-pie-label i{display:block; font-size:18px; line-height:1; margin-bottom:2px;}
  .infographic-pie-label-title{font-family:'Public Sans',sans-serif; font-weight:800; font-size:10px; text-transform:uppercase; letter-spacing:.03em;}
  .infographic-pie-label-value{font-weight:800; font-size:15px; line-height:1.1;}

  /* ===== Infographic-style bar chart (dashboard: assets by group) ===== */
  .infographic-bar-wrap{display:flex; align-items:flex-end; justify-content:space-around; gap:.6rem; height:220px; padding:0 .25rem;}
  .infographic-bar-col{display:flex; flex-direction:column; align-items:center; flex:1 1 0; height:100%; justify-content:flex-end; min-width:0;}
  .infographic-bar-value{font-weight:800; font-size:.78rem; color:var(--ink); margin-bottom:.35rem;}
  .infographic-bar-track{width:100%; max-width:38px; height:150px; display:flex; align-items:flex-end;}
  .infographic-bar-fill{width:100%; border-radius:.6rem .6rem .3rem .3rem; box-shadow:0 10px 20px rgba(20,40,60,.18); min-height:6px; transition:height .25s ease;}
  .infographic-bar-label{margin-top:.5rem; font-size:.66rem; font-weight:700; color:var(--sub); text-align:center; text-transform:uppercase; letter-spacing:.02em; max-width:76px; line-height:1.2;}
  .dashboard-chart-tooltip{background:#0f3557; color:#fff; padding:.55rem .7rem; border-radius:.55rem; box-shadow:0 8px 20px rgba(15,53,87,.22); font-size:.72rem; line-height:1.35; white-space:nowrap;}

  /* ===== Infographic-style donut/gauge (dashboard: temp connection summary) ===== */
  .infographic-donut-wrap{display:flex; align-items:center; justify-content:center; height:160px;}
  .infographic-donut{position:relative; width:150px; height:150px; border-radius:50%; box-shadow:0 12px 26px rgba(20,40,60,.18);}
  .infographic-donut-hole{position:absolute; inset:16%; background:#fff; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:inset 0 0 0 1px var(--line);}
  .infographic-donut-hole i{font-size:20px; line-height:1; margin-bottom:2px;}
  .infographic-donut-value{font-family:'Public Sans',sans-serif; font-weight:800; font-size:1.35rem; line-height:1.1;}
  /* ===== Dashboard chart draw animations =====
     No loading skeletons: charts render immediately and animate from zero.
     Bars grow upward; pie and donut arcs draw from 0° to their final angle. */
  @keyframes chartReveal{from{opacity:0; transform:translateY(5px);}to{opacity:1; transform:translateY(0);}}
  .chart-reveal{animation:chartReveal .28s ease-out both;}
  .infographic-bar-fill{transform-origin:bottom center;}
  .chart-label-reveal{transition:opacity .22s ease-out;}
  .dashboard-link-card{transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;}
  .dashboard-link-card:hover{transform:translateY(-1px); box-shadow:0 8px 20px rgba(15,23,42,.08); border-color:rgba(21,80,138,.22);}
  .dashboard-link-card:focus-visible{outline:2px solid rgba(21,80,138,.45); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){
    .chart-reveal{animation:none;}
    .chart-label-reveal{transition:none;}
  }
  @media (max-width:720px){
    .login-page-bg{padding:16px 16px 32px; align-items:flex-start; display:block;}
    .login-card-shell{padding:8px; border-radius:14px; box-shadow:0 10px 26px rgba(15,23,42,.14);}
    .login-card{position:static; width:100%; height:auto; margin-top:16px; background:#fff; border-radius:16px;
      box-shadow:0 10px 30px rgba(15,23,42,.10); padding:20px 18px; gap:12px; container-type:normal;}
    .login-field{padding:0 14px; height:44px; gap:10px; border-radius:10px;}
    .login-field svg{width:18px; height:18px;}
    .login-field input{font-size:14px; padding:0;}
    .login-row, .login-row label, .login-row a{font-size:13px;}
    .login-row input[type=checkbox]{width:15px; height:15px;}
    .login-btn{height:44px; font-size:14px; border-radius:10px;}
    .login-error{font-size:12px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  BUILD_ID: '2026-08-11-onedrive-graph-integration-v1', // bump this whenever the file changes — shown in the footer so we can confirm which build is actually loaded
  // Change these before real use — this is still a light, client-side gate
  // (see requireRole()/AUTH below), not a substitute for real server-side auth.
  USERS: [
    { username:'admin',  password:'admin123',  role:'admin',  label:'Admin' },
    { username:'user',   password:'user123',   role:'user',   label:'User' },
    { username:'viewer', password:'viewer123', role:'viewer', label:'Viewer' }
  ],
  // Microsoft Graph / OneDrive integration. CLIENT_ID is the "Application
  // (client) ID" from your Azure AD App Registration's Overview page.
  // AUTHORITY 'common' allows both personal Microsoft accounts and work/school
  // accounts to sign in — narrow it to https://login.microsoftonline.com/<tenant-id>
  // if you only want your organisation's accounts. FOLDER is the top-level
  // OneDrive folder that state backups and PDFs sync into.
  MS_GRAPH: {
    CLIENT_ID: '5b81fba4-dc33-4f70-8ae0-1bde6971167c',
    AUTHORITY: 'https://login.microsoftonline.com/common',
    FOLDER: 'Safety Dashboard Data'
  },
  // Legacy Google Apps Script fallback — only used when MS_GRAPH.CLIENT_ID above is blank.
  GAS_URL: '',
  ORG_NAME: 'Periodic Safety Assessments (Internal to Station)',
  DOC_CODE: 'LMI/FGUTPS/SAFETY/OD/OPS/SAFT/005/safety-16 Rev. No.: R1 June 2024'
};

/* ============================================================
   MICROSOFT GRAPH / ONEDRIVE INTEGRATION
   Uses MSAL.js (loaded in <head>) for browser-based sign-in, then talks
   directly to the Microsoft Graph API — no server backend required.
   State backups and PDFs land in a OneDrive folder named CONFIG.MS_GRAPH.FOLDER
   inside the signed-in user's own OneDrive.
   ============================================================ */
const msalInstance = (CONFIG.MS_GRAPH && CONFIG.MS_GRAPH.CLIENT_ID) ? new msal.PublicClientApplication({
  auth: {
    clientId: CONFIG.MS_GRAPH.CLIENT_ID,
    authority: CONFIG.MS_GRAPH.AUTHORITY || 'https://login.microsoftonline.com/common',
    // Points at a dedicated blank page (not this app's own URL) so MSAL's
    // popup sign-in response doesn't collide with this app's own hash-based
    // router, which would otherwise consume the auth response from the URL
    // hash before MSAL can read it (causes "hash_does_not_contain_known_properties").
    redirectUri: window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1) + 'blank.html'
  },
  cache: { cacheLocation: 'localStorage' }
}) : null;
if(msalInstance){
  // Restore whichever account MSAL already has cached from a previous visit,
  // so returning users don't have to sign in again every load.
  const cachedAccount = msalInstance.getAllAccounts()[0];
  if(cachedAccount) msalInstance.setActiveAccount(cachedAccount);
}

function isOneDriveConnected(){
  return !!(msalInstance && (msalInstance.getActiveAccount() || msalInstance.getAllAccounts().length));
}

async function signInOneDrive(){
  if(!msalInstance) return;
  try{
    const res = await msalInstance.loginPopup({ scopes:['Files.ReadWrite'] });
    msalInstance.setActiveAccount(res.account);
    toast('Signed in to OneDrive as ' + res.account.username);
    render();
  }catch(e){
    toast('OneDrive sign-in failed (' + (e && e.message || 'unknown error') + ').', {duration:8000});
  }
}

function signOutOneDrive(){
  if(!msalInstance) return;
  msalInstance.setActiveAccount(null);
  toast('Disconnected this app from OneDrive.');
  render();
}

async function getGraphToken(){
  if(!msalInstance) throw new Error('OneDrive is not configured (missing CONFIG.MS_GRAPH.CLIENT_ID).');
  const account = msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0];
  if(!account) throw new Error('Not signed in to OneDrive.');
  const request = { scopes:['Files.ReadWrite'], account };
  try{
    const res = await msalInstance.acquireTokenSilent(request);
    return res.accessToken;
  }catch(e){
    // Silent refresh failed (e.g. token expired past the refresh window) — fall back to a popup.
    const res = await msalInstance.acquireTokenPopup(request);
    return res.accessToken;
  }
}

function encodeGraphPath(path){
  return path.split('/').map(encodeURIComponent).join('/');
}

function dataUriToBytes(dataUri){
  const base64 = dataUri.split(',')[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

// Uploads raw bytes to OneDrive at the given path (relative to the signed-in
// user's drive root) — Graph creates any missing folders in the path automatically.
// Files ≤4MB go through a single PUT; larger files (e.g. PDFs with embedded
// photos) use a resumable upload session, chunked as Graph requires.
async function uploadBytesToOneDrive(path, bytes, mimeType){
  const token = await getGraphToken();
  const encodedPath = encodeGraphPath(path);
  const SIMPLE_LIMIT = 4 * 1024 * 1024;

  if(bytes.byteLength <= SIMPLE_LIMIT){
    const resp = await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:/${encodedPath}:/content`, {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': mimeType },
      body: bytes
    });
    if(!resp.ok) throw new Error('OneDrive upload failed (HTTP ' + resp.status + ')');
    const json = await resp.json();
    return json.webUrl || '';
  }

  const sessionResp = await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:/${encodedPath}:/createUploadSession`, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': 'replace' } })
  });
  if(!sessionResp.ok) throw new Error('Could not start OneDrive upload session (HTTP ' + sessionResp.status + ')');
  const { uploadUrl } = await sessionResp.json();

  const CHUNK = 327680 * 10; // ~3.2MB — must be a multiple of 320 KiB per Graph's upload-session rules
  let start = 0, lastJson = null;
  while(start < bytes.byteLength){
    const end = Math.min(start + CHUNK, bytes.byteLength);
    const chunk = bytes.slice(start, end);
    const r = await fetch(uploadUrl, {
      method: 'PUT',
      headers: {
        'Content-Length': String(chunk.byteLength),
        'Content-Range': `bytes ${start}-${end - 1}/${bytes.byteLength}`
      },
      body: chunk
    });
    if(!r.ok && r.status !== 202) throw new Error('OneDrive chunk upload failed (HTTP ' + r.status + ')');
    if(r.status !== 202) lastJson = await r.json();
    start = end;
  }
  return lastJson ? (lastJson.webUrl || '') : '';
}

// Pushes the full app state to OneDrive as a rolling JSON backup (overwritten
// on every save — same behaviour the old GAS_URL sync had).
async function syncStateToOneDrive(json){
  await uploadBytesToOneDrive(`${CONFIG.MS_GRAPH.FOLDER}/dashboard-state.json`, new TextEncoder().encode(json), 'application/json');
}

// Reads a File as a base64 data URL (used for embedding signatures/photos into PDFs).
function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    if(!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = ()=> reject(reader.error);
    reader.readAsDataURL(file);
  });
}
// Reads a file, then downscales/re-encodes it as JPEG if it's larger than maxDim on its
// longest side. A full-resolution phone photo can be 4-8 MB as base64, and localStorage's
// quota is typically only 5-10 MB total — a few uncompressed photos/signatures is enough
// to exceed it. Falls back to the plain (uncompressed) data URL if anything goes wrong.
function readFileAsCompressedDataURL(file, maxDim, quality){
  maxDim = maxDim || 1400; quality = quality || 0.72;
  return new Promise((resolve, reject)=>{
    if(!file){ resolve(null); return; }
    readFileAsDataURL(file).then(rawDataUrl=>{
      const img = new Image();
      img.onload = ()=>{
        try{
          const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth * scale));
          const h = Math.max(1, Math.round(img.naturalHeight * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); // flatten transparency (JPEG has no alpha)
          ctx.drawImage(img, 0, 0, w, h);
          const compressed = canvas.toDataURL('image/jpeg', quality);
          // Only use the compressed version if it's actually smaller — tiny images can grow under JPEG re-encoding.
          resolve(compressed.length < rawDataUrl.length ? compressed : rawDataUrl);
        }catch(e){ resolve(rawDataUrl); }
      };
      img.onerror = ()=> resolve(rawDataUrl);
      img.src = rawDataUrl;
    }).catch(reject);
  });
}
// Loads an image data URL just to read its natural pixel dimensions, so PDFs can
// place it at the correct aspect ratio instead of stretching it.
function loadImageDims(dataUrl){
  return new Promise((resolve)=>{
    if(!dataUrl){ resolve(null); return; }
    const img = new Image();
    img.onload = ()=> resolve({w:img.naturalWidth||1, h:img.naturalHeight||1});
    img.onerror = ()=> resolve(null);
    img.src = dataUrl;
  });
}
// Scales natural {w,h} down to fit within maxW x maxH, preserving aspect ratio.
function fitDims(natural, maxW, maxH){
  if(!natural) return {w:maxW, h:maxH};
  const ratio = Math.min(maxW/natural.w, maxH/natural.h, 1);
  return {w: Math.round(natural.w*ratio), h: Math.round(natural.h*ratio)};
}
// jsPDF's addImage needs a format hint matching the data URL's mime type.
function pdfImageFormat(dataUrl){
  if(!dataUrl) return 'PNG';
  const m = dataUrl.match(/^data:image\/(png|jpe?g|webp)/i);
  if(!m) return 'PNG';
  const type = m[1].toLowerCase();
  return type==='png' ? 'PNG' : (type==='webp' ? 'WEBP' : 'JPEG');
}

/* ============================================================
   STATE + PERSISTENCE  (localStorage now; swap in GAS_URL fetches
   to point at the Apps Script backend in apps_script.gs later —
   the shape of STATE mirrors the Sheet tabs described in the spec)
   ============================================================ */
const LS_KEY = 'ucim_state_v1';
const LS_BACKUP_KEY = LS_KEY + '_backup'; // single rolling backup — NOT date-stamped (see note below)
let STATE = { templates:[], assets:[], inspections:[], tempConnections:[] };

// One-time cleanup: earlier builds wrote a NEW dated key (ucim_state_v1_backup_2026-01-01,
// _backup_2026-01-02, ...) on EVERY save and never deleted old ones. Since every save
// duplicated the entire STATE (including base64 signatures/photos), this silently filled up
// localStorage over days/weeks until the quota was hit — which is what caused the
// "Setting the value of 'ucim_state_v1' exceeded the quota" error. This removes those
// leftover dated keys so existing installs recover free space immediately.
function purgeLegacyDatedBackups(){
  try{
    const toRemove = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(LS_KEY + '_backup_') === 0) toRemove.push(k);
    }
    toRemove.forEach(k=> localStorage.removeItem(k));
  }catch(e){ /* best-effort */ }
}

function loadState(){
  purgeLegacyDatedBackups();
  const raw = localStorage.getItem(LS_KEY);
  if(raw){
    try{ STATE = JSON.parse(raw); }catch(e){ STATE = { templates:[], assets:[], inspections:[], tempConnections:[] }; }
  }
  if(!STATE.templates || STATE.templates.length===0){
    STATE.templates = JSON.parse(JSON.stringify(SEED_TEMPLATES));
    STATE.assets = STATE.assets || [];
    STATE.inspections = STATE.inspections || [];
    STATE.tempConnections = STATE.tempConnections || [];
    saveState();
  }
  STATE.tempConnections = STATE.tempConnections || []; // backward-compat for sessions saved before this feature existed
  seedDemoChecklistData();
  if(STATE.assets.length && STATE.inspections.length) saveState();
}

    const m = String(x.getMonth()+1).padStart(2,'0');
    const day = String(x.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  };
  const dateOffset = days => {
    const d = new Date(today);
    d.setDate(d.getDate()+days);

  const demoPeople = [

// Throws on failure (instead of silently swallowing it) so callers that just did
// STATE.<array>.push(record) can undo that push and let the user retry cleanly, rather
// than the record silently existing in memory but never actually being persisted.
function saveState(){
  const json = JSON.stringify(STATE);
  try{
    localStorage.setItem(LS_KEY, json);
    // Single rolling backup (overwritten every save) instead of one-per-day — gives a
    // recovery copy without the unbounded growth that caused the quota error above.
    try{ localStorage.setItem(LS_BACKUP_KEY, json); }catch(e){ /* backup is best-effort; main save above already succeeded */ }
  }catch(err){
    const isQuotaError = err && (err.name==='QuotaExceededError' || err.name==='NS_ERROR_DOM_QUOTA_REACHED' || err.code===22);
    if(isQuotaError){
      // Free whatever we can and retry once before giving up.
      try{ localStorage.removeItem(LS_BACKUP_KEY); }catch(e){}
      try{
        localStorage.setItem(LS_KEY, json);
      }catch(err2){
        const sizeMb = (json.length/1024/1024).toFixed(1);
        const e = new Error('Browser storage is full (this data is ~' + sizeMb + ' MB). Photos and signatures are usually the cause — try deleting some older inspections from the asset history to free up space, or use a device/browser with more free storage.');
        e.name = 'QuotaExceededError';
        throw e;
      }
    } else {
      throw err;
    }
  }
  if(msalInstance && isOneDriveConnected()){
    syncStateToOneDrive(json).catch(()=>{ /* offline/error — localStorage backup already saved */ });
  } else if(CONFIG.GAS_URL){
    fetch(CONFIG.GAS_URL, {
      method:'POST',
      body: new URLSearchParams({ data: json })
    }).catch(()=>{ /* offline — localStorage backup already saved */ });
  }
}

/* ============================================================
   DOM helper
   ============================================================ */
function el(tag, attrs, children){
  const node = document.createElement(tag);
  attrs = attrs || {};
  for(const k in attrs){
    if(k==='class') node.className = attrs[k];
    else if(k==='html') node.innerHTML = attrs[k];
    else if(k.startsWith('on') && typeof attrs[k]==='function') node.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k]!==undefined && attrs[k]!==null) node.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c=>{
    if(c===null||c===undefined) return;
    node.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
  });
  return node;
}
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }

// Builds a set of CSS Grid "rows" (header + data) that all share the exact same
// grid-template-columns string. Because every row is an independent grid using the
// identical column definition, header and data cells are structurally forced to the
// same column boundaries — this sidesteps HTML <table> column-layout inconsistencies
// seen in some browser/webview rendering engines.
// columns: [{label, width, align}]  width is any CSS track size, e.g. '28%', '140px', '1fr'
// rows: array of arrays of DOM nodes/strings, same length as columns
function gridTable(columns, rows, opts){
  opts = opts || {};
  const templateCols = columns.map(c=> c.width || '1fr').join(' ');
  function buildRow(cellValues, isHead){
    const row = el('div', {class:'gt-row'+(isHead?' gt-head':''), style:'grid-template-columns:'+templateCols});
    cellValues.forEach((val,i)=>{
      const col = columns[i] || {};
      const cls = 'gt-cell' + (col.align==='right'?' text-right':'') + (opts.wrap===false?'':' wrap');
      const content = isHead ? [val] : (Array.isArray(val) ? val : [val]);
      row.appendChild(el('div', {class:cls}, content));
    });
    return row;
  }
  const container = el('div', {class:'grid-table'+(opts.dividers?' gt-dividers':'')});
  container.appendChild(buildRow(columns.map(c=>c.label), true));
  rows.forEach(r=> container.appendChild(buildRow(r, false)));
  return container;
}

// Renders a sortable gridTable into `wrap` (clearing it first) and re-renders
// on every header click. Any column with a `sort` accessor gets a clickable
// header + sort-direction icon; columns without `sort` are plain labels.
//   wrap        — container element to render into (its contents are replaced)
//   columns     — [{label, width, align, sort:(item)=>comparable}]
//   data        — array of underlying data items (not yet turned into cells)
//   rowBuilder  — (item) => array of cell contents, one per column
//   opts.initialSortIdx / opts.initialSortDir (1 asc, -1 desc) / opts.dividers
function renderSortableTable(wrap, columns, data, rowBuilder, opts){
  opts = opts || {};
  let sortIdx = opts.initialSortIdx != null ? opts.initialSortIdx : null;
  let sortDir = opts.initialSortDir || 1;
  function draw(){
    let items = data.slice();
    if(sortIdx != null && columns[sortIdx] && columns[sortIdx].sort){
      const getVal = columns[sortIdx].sort;
      items.sort((a,b)=>{
        const va = getVal(a), vb = getVal(b);
        if(va < vb) return -1 * sortDir;
        if(va > vb) return 1 * sortDir;
        return 0;
      });
    }
    const headerLabels = columns.map((c,i)=>{
      if(!c.sort) return c.label;
      const active = sortIdx === i;
      const icon = active ? (sortDir===1 ? 'bx-sort-up' : 'bx-sort-down') : 'bx-sort-alt-2';
      return el('span', {class:'inline-flex items-center gap-1 cursor-pointer select-none', onclick:()=>{
        if(sortIdx===i) sortDir = -sortDir; else { sortIdx = i; sortDir = 1; }
        draw();
      }}, [c.label, el('i', {class:'bx '+icon, style:'font-size:.9rem; opacity:'+(active?'1':'.4')+';'})]);
    });
    clear(wrap);
    wrap.appendChild(gridTable(
      columns.map((c,i)=>({label:headerLabels[i], width:c.width, align:c.align})),
      items.map(rowBuilder),
      {dividers:opts.dividers}
    ));
  }
  draw();
}

function toast(msg, opts){
  opts = opts||{};
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = el('div', {class:'toast'}, [
    el('span', {}, [msg]),
    opts.undo ? el('button', {class:'btn btn-ghost', style:'padding:.2rem .6rem;background:#1e293b;color:#fff;border-color:#334155', onclick:()=>{ opts.undo(); t.remove(); }}, ['Undo']) : null
  ]);
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), opts.duration || 3500);
}

function renderLogin(){
  const app = document.getElementById('app');
  clear(app);

  const userIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
  const lockIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
  const eyeIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const eyeOffIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 1 11s4 7 11 7a9.26 9.26 0 0 0 5.39-1.61"/><path d="m1 1 22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>';

  const userInput = el('input', {placeholder:'Username', autocomplete:'username'});
  const passInput = el('input', {type:'password', placeholder:'Password', autocomplete:'current-password'});
  const err = el('p', {class:'login-error hidden'}, ['Incorrect username or password.']);

  function attempt(){
    const match = CONFIG.USERS.find(u=>u.username===userInput.value.trim() && u.password===passInput.value);
    if(match){
      sessionStorage.setItem('ucim_user', JSON.stringify({username:match.username, role:match.role, label:match.label}));
      loadState();
      location.hash = '/';
      render();
    } else { err.classList.remove('hidden'); }
  }
  userInput.addEventListener('keydown', e=>{ if(e.key==='Enter') attempt(); });
  passInput.addEventListener('keydown', e=>{ if(e.key==='Enter') attempt(); });

  const eyeBtn = el('button', {type:'button', class:'eye-toggle', title:'Show password', html:eyeIcon});
  eyeBtn.addEventListener('click', ()=>{
    const showing = passInput.type === 'text';
    passInput.type = showing ? 'password' : 'text';
    eyeBtn.innerHTML = showing ? eyeIcon : eyeOffIcon;
  });

  const remember = el('input', {type:'checkbox', id:'login-remember'});

  const roleCard = (role,label,desc)=> el('button', {type:'button', class:'card p-3 text-left hover:shadow-md transition w-full', onclick:()=>{
    const u = CONFIG.USERS.find(x=>x.role===role);
    userInput.value = u.username; passInput.value = u.password; attempt();
  }}, [
    el('div', {class:'flex items-center justify-between'}, [
      el('span', {class:'font-head font-bold text-sm'}, [label]),
      el('span', {class:'role-chip role-'+role}, [role])
    ]),
    el('div', {class:'text-xs text-slate-400 mt-1'}, [desc])
  ]);

  const loginCard = el('div', {class:'login-card'}, [
    err,
    el('div', {class:'login-field'}, [
      el('span', {html:userIcon}),
      userInput
    ]),
    el('div', {class:'login-field'}, [
      el('span', {html:lockIcon}),
      passInput,
      eyeBtn
    ]),
    el('div', {class:'login-row'}, [
      el('label', {for:'login-remember'}, [remember, 'Remember me']),
      el('a', {href:'#', onclick:(e)=>{ e.preventDefault(); alert('Please contact your administrator to reset your password.'); }}, ['Forgot Password?'])
    ]),
    el('button', {type:'button', class:'login-btn', onclick:attempt}, ['LOGIN'])
  ]);

  const bgImg = el('img', {src:LOGIN_BG_DATA_URL, alt:'Safety Compliance Module', draggable:'false'});
  const loginWrap = el('div', {class:'login-wrap'}, [bgImg, loginCard]);
  // Card shell: floats the (40% smaller) artwork+form above the plain gray
  // page background, styled like a drop-shadowed playing card.
  const loginShell = el('div', {class:'login-card-shell'}, [loginWrap]);
  const bgWrap = el('div', {class:'login-page-bg'}, [loginShell]);

  const demo = el('div', {class:'login-demo'}, [
    el('div', {class:'text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2 text-center'}, ['Quick demo sign-in']),
    el('div', {class:'grid grid-cols-3 gap-2 max-w-md mx-auto'}, [
      roleCard('viewer','Viewer','View only'),
      roleCard('user','User','Create & edit'),
      roleCard('admin','Admin','Full access')
    ])
  ]);

  const wrap = el('div', {class:'min-h-screen page-fade', style:'padding-bottom:24px;'}, [bgWrap, demo, siteCopyright()]);
  app.appendChild(wrap);
}

/* ============================================================
   DUE-DATE / STATUS HELPERS
   ============================================================ */
function lastInspectionDate(assetId){
  const rows = STATE.inspections.filter(i=>i.assetId===assetId).sort((a,b)=> new Date(b.date)-new Date(a.date));
  return rows.length ? rows[0].date : null;
}
function nextDueDate(asset, tmpl){
  const last = lastInspectionDate(asset.id);
  const base = last ? new Date(last) : new Date(asset.createdOn);
  const due = new Date(base);
  due.setDate(due.getDate() + (tmpl.frequencyDays||30));
  return due;
}
function statusFor(asset, tmpl){
  const due = nextDueDate(asset, tmpl);
  const now = new Date();
  const daysLeft = Math.ceil((due - now) / 86400000);
  if(daysLeft < 0) return {label:`Overdue ${Math.abs(daysLeft)}d`, cls:'status-danger', daysLeft};
  if(daysLeft <= (tmpl.reminderLeadDays||5)) return {label:`Due in ${daysLeft}d`, cls:'status-warn-30', daysLeft};
  return {label:`OK · due in ${daysLeft}d`, cls:'status-ok', daysLeft};
}
function pill(status){ return el('span', {class:'pill '+status.cls}, [status.label]); }
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}); }

/* ============================================================
   ROUTER
   ============================================================ */
const routes = {};
function route(pattern, handler){ routes[pattern] = handler; }
function navigate(hash){ location.hash = hash; }
function currentRoute(){
  const hash = location.hash.slice(1) || '/';
  for(const pattern in routes){
    const keys = [];
    const rx = new RegExp('^' + pattern.replace(/:[^/]+/g, m=>{ keys.push(m.slice(1)); return '([^/]+)'; }) + '$');
    const m = hash.match(rx);
    if(m){
      const params = {};
      keys.forEach((k,i)=> params[k] = decodeURIComponent(m[i+1]));
      return { handler: routes[pattern], params };
    }
  }
  return null;
}

/* ============================================================
   PAGE: DASHBOARD  (#/) — bar + pie charts across all assets
   ============================================================ */
let _chartInstances = [];
function destroyCharts(){ _chartInstances.forEach(c=>c.destroy()); _chartInstances = []; }

// Infographic-style pie: colored wedges (conic-gradient) with icon + label
// overlaid directly on each slice, in the spirit of the "PLAN / GROW / BUILD"
// style reference infographic.
function infographicPie(segments){
  const total = segments.reduce((s,x)=> s + x.value, 0) || 1;
  let cumulative = 0;

  const sliceData = segments.map(seg=>{
    const start = cumulative / total * 360;
    cumulative += seg.value;
    const end = cumulative / total * 360;
    return {...seg, start, end};
  });

  const circle = el('div', {
    class:'infographic-pie',
    style:'background:#eceef0;'
  });

  cumulative = 0;
  const labels = segments.filter(s=>s.value > 0).map(seg=>{
    const start = cumulative / total * 360;
    cumulative += seg.value;
    const end = cumulative / total * 360;
    const mid = (start + end) / 2;
    const rad = (mid - 90) * Math.PI / 180;
    const r = 33;
    const x = 50 + r * Math.cos(rad);
    const y = 50 + r * Math.sin(rad);

    return el('div', {
      class:'infographic-pie-label chart-label-reveal',
      style:`left:${x}%; top:${y}%; opacity:0;`
    }, [
      el('i', {class:'bx '+seg.icon}),
      el('div', {class:'infographic-pie-label-title'}, [seg.label]),
      el('div', {class:'infographic-pie-label-value'}, [String(seg.value)])
    ]);
  });

  // Explicit radial separators keep each sector boundary perfectly straight
  // and aligned with the conic-gradient wedges.
  const separators = sliceData.slice(0, -1).map(seg=> el('div', {
    class:'infographic-pie-separator',
    style:`transform:rotate(${seg.end - 90}deg);`
  }));
  separators.forEach(s=> circle.appendChild(s));

  // Interactive sector overlay: hover emphasizes one sector and pops it outward;
  // click navigates directly to Reminders. The overlay is revealed after the
  // existing 0-to-full pie animation so the original growth animation is preserved.
  const sectorLayer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  sectorLayer.setAttribute('viewBox', '0 0 100 100');
  sectorLayer.setAttribute('aria-hidden', 'true');
  sectorLayer.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;z-index:2;overflow:visible;opacity:0;transition:opacity .18s ease;pointer-events:none;';

  const polar = (angle, radius=50)=>{
    const rad = (angle - 90) * Math.PI / 180;
    return {x:50 + radius*Math.cos(rad), y:50 + radius*Math.sin(rad)};
  };
  const sectorPath = (start, end)=>{
    const a = polar(start), b = polar(end);
    const large = (end-start) > 180 ? 1 : 0;
    return `M 50 50 L ${a.x} ${a.y} A 50 50 0 ${large} 1 ${b.x} ${b.y} Z`;
  };

  const sectorPaths = sliceData.map((seg, index)=>{
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', sectorPath(seg.start, seg.end));
    path.setAttribute('fill', seg.color);
    path.setAttribute('stroke', 'none');
    path.style.cssText = 'cursor:pointer;pointer-events:all;opacity:.01;transition:transform .18s ease,opacity .18s ease;transform-box:fill-box;transform-origin:center;';
    path.setAttribute('tabindex', '0');
    path.setAttribute('role', 'button');
    path.setAttribute('aria-label', `${seg.label}: ${seg.value}. Open reminders`);

    const applySectorHover = (active)=>{
      sectorPaths.forEach((other, i)=>{
        other.style.opacity = active < 0 ? '.01' : (i === active ? '.98' : '.01');
        if(i === active){
          const mid = (sliceData[i].start + sliceData[i].end) / 2;
          const r = (mid - 90) * Math.PI / 180;
          const dx = Math.cos(r) * 3.2;
          const dy = Math.sin(r) * 3.2;
          other.style.transform = `translate(${dx}px, ${dy}px)`;
        }else{
          other.style.transform = 'translate(0,0)';
        }
      });
    };

    path.addEventListener('mouseenter', ()=>applySectorHover(index));
    path.addEventListener('mouseleave', ()=>applySectorHover(-1));
    path.addEventListener('focus', ()=>applySectorHover(index));
    path.addEventListener('blur', ()=>applySectorHover(-1));
    path.addEventListener('click', ()=>navigate('#/reminders'));
    path.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); navigate('#/reminders'); }
    });
    sectorLayer.appendChild(path);
    return path;
  });

  const wrap = el('div', {class:'infographic-pie-inner'}, [circle, sectorLayer, ...labels]);

  wrap._chartAnimate = (progress)=>{
    const eased = 1 - Math.pow(1 - progress, 3);
    const stops = sliceData.map(seg=>{
      const s = seg.start * eased;
      const e = seg.end * eased;
      return `${seg.color} ${s}deg ${e}deg`;
    });

    const finalAngle = sliceData.length
      ? sliceData[sliceData.length - 1].end * eased
      : 0;

    circle.style.background = progress > 0
      ? `conic-gradient(${stops.join(', ')}, #eceef0 ${finalAngle}deg 360deg)`
      : '#eceef0';

    separators.forEach(separator=>{
      separator.style.opacity = progress >= .12 ? '1' : '0';
    });

    labels.forEach(label=>{
      label.style.opacity = progress >= .72
        ? String(Math.min(1, (progress - .72) / .28))
        : '0';
    });

    // Enable sector interaction only after the pie has finished forming.
    sectorLayer.style.opacity = progress >= .72 ? '1' : '0';
    sectorLayer.style.pointerEvents = progress >= .72 ? 'auto' : 'none';
  };

  return wrap;
}

// One-shot Dashboard bar-chart section jump. It is consumed automatically on Checklist navigation.
let _dashboardBarJump = null;

// Infographic-style bar chart: interactive rounded columns that grow from zero height.
function infographicBarChart(items){
  const max = Math.max(1, ...items.map(i=>i.value));
  const targets = [];
  let hoveredIndex = -1;

  const applyEmphasis = ()=>{
    cols.forEach((col, index)=>{
      const hovered = hoveredIndex === index;
      col.style.opacity = hoveredIndex < 0 || hovered ? '1' : '.55';
      col.style.transform = hovered ? 'translateY(-4px)' : 'translateY(0)';
    });
  };

  const cols = items.map((it,itemIndex)=>{
    const pct = Math.max(4, Math.round((it.value / max) * 100));
    const fill = el('div', {
      class:'infographic-bar-fill',
      style:`height:0%; background:${it.color};`
    });
    targets.push({fill, pct});

    const col = el('div', {
      class:'infographic-bar-col',
      style:'cursor:pointer; transition:opacity .18s ease, transform .18s ease;',
      title:''
    }, [
      el('div', {class:'infographic-bar-value'}, [String(it.value)]),
      el('div', {class:'infographic-bar-track'}, [fill]),
      el('div', {class:'infographic-bar-label'}, [it.label])
    ]);

    col.addEventListener('mouseenter', ()=>{
      hoveredIndex = itemIndex;
      applyEmphasis();
    });
    col.addEventListener('mouseleave', ()=>{
      hoveredIndex = -1;
      applyEmphasis();
    });
    col.addEventListener('click', ()=>{
      // Navigate to the full Checklist page and jump to the clicked group.
      _dashboardBarJump = it.label;
      navigate('#/checklist');
    });

    return col;
  });

  applyEmphasis();

  const wrap = el('div', {class:'infographic-bar-wrap'}, cols);

  wrap._chartAnimate = (progress)=>{
    const eased = 1 - Math.pow(1 - progress, 3);
    targets.forEach(({fill,pct})=>{
      fill.style.height = `${pct * eased}%`;
    });
  };

  return wrap;
}

// Infographic-style donut/gauge: arc grows from 0° to its final angle.
function infographicDonut(value, total, color, icon){
  const finalAngle = total > 0 ? (value / total) * 360 : 0;

  const ring = el('div', {
    class:'infographic-donut',
    style:'background:#eceef0;'
  });

  const hole = el('div', {
    class:'infographic-donut-hole chart-label-reveal',
    style:'opacity:0;'
  }, [
    el('i', {class:'bx '+icon, style:'color:'+color+';'}),
    el('div', {class:'infographic-donut-value', style:'color:'+color+';'}, [String(value)])
  ]);

  const wrap = el('div', {style:'position:relative;'}, [ring, hole]);

  wrap._chartAnimate = (progress)=>{
    const eased = 1 - Math.pow(1 - progress, 3);
    const angle = finalAngle * eased;

    ring.style.background = finalAngle > 0
      ? `conic-gradient(${color} 0deg ${angle}deg, #eceef0 ${angle}deg 360deg)`
      : '#eceef0';

    hole.style.opacity = progress >= .65
      ? String(Math.min(1, (progress - .65) / .35))
      : '0';
  };

  return wrap;
}

// Render the actual chart immediately, then animate it from zero.
// There is deliberately no loading skeleton.
function revealChart(container, buildFn, duration){
  clear(container);

  const chart = buildFn();
  chart.classList.add('chart-reveal');
  container.appendChild(chart);
  _chartInstances.push({destroy:()=>{ if(typeof chart._destroyChart==='function') chart._destroyChart(); }});

  const animate = chart._chartAnimate;
  if(typeof animate !== 'function') return;

  const totalDuration = duration == null ? 900 : duration;
  const startTime = performance.now();

  const frame = (now)=>{
    if(!document.body.contains(container)) return;

    const progress = Math.min(1, (now - startTime) / totalDuration);
    animate(progress);

    if(progress < 1) requestAnimationFrame(frame);
  };

  requestAnimationFrame(frame);
}

/* ============================================================
   PAGE: CHECKLIST  (#/checklist) — grouped tabular arrangement:
   Ladders / ELCB-RCD / Mobile Crane / Electrical Tools /
   Welding Machines / PPEs
   ============================================================ */
function renderChecklistPage(filterGroup){
  const groups = {};
  GROUP_ORDER.forEach(g=> groups[g]=[]);
  STATE.templates.forEach(t=>{
    const g = groupOf(t);
    if(filterGroup && g !== filterGroup) return;
    if(!groups[g]) groups[g]=[];
    groups[g].push(t);
  });

  const sections = Object.keys(groups).filter(g=>groups[g].length).map(g=>{
    const rows = groups[g].map(t=>{
      const assets = STATE.assets.filter(a=>a.templateId===t.id);
      let overdue=0, dueSoon=0;
      assets.forEach(a=>{ const s = statusFor(a,t); if(s.cls==='status-danger') overdue++; else if(s.cls==='status-warn-30') dueSoon++; });
      return [

/* ============================================================================
   TEMPORARY ELECTRICAL CONNECTION MODULE
   Integrated from the standalone NTPC Unchahar temp-connection frontend.
   Data lives in STATE.tempConnections (localStorage, same as everything else
   in this app) so a request submitted on "New Request" shows up immediately
   on "Approver" and "Register" — no separate backend needed.
   ============================================================================ */
const TC_DEPARTMENTS = ['AHM','Ash Utilisation','AUTO BASE','BMD','C&I','C&M','CHEMISTRY','CIVIL','EEMG','EMD','ENVT. MGT.','FM','FQA','HR','IT','MEDICAL','MTP','OFS','OPERATION','PROJECT','SAFETY','TMD'];
const TC_PURPOSES = ['Area illumination','Welding','Pump','Belt jointing machine','SR Machine Supply','Other'];
const TC_CHECKLIST_ITEMS = [
  { key:'board', label:'Extension board / SFU panel is in healthy condition' },
  { key:'joints', label:'No loose connection — all joints properly insulated' },
  { key:'ir', label:'Extension cable IR value checked and found OK' },
  { key:'elcb', label:'ELCB provided (if applicable)' },
  { key:'earthing', label:'Supply earthing is proper' }
];
// True once an Issued connection's requested period has ended and it hasn't been
// confirmed removed yet (status stays 'Issued' in storage — this is a computed,
// point-in-time flag, not a stored state, so it's always accurate even for old data).
function tcIsOverdue(req){
  if(req.status!=='Issued' || !req.periodTo) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  const validTo = new Date(req.periodTo); validTo.setHours(0,0,0,0);
  return validTo < today;
}
// The status a person actually sees: Issued connections whose period has ended show
// as "Pending for removal" until the approver confirms the removal (which moves the
// stored status to 'Closed').
function tcDisplayStatus(req){
  if(req.status==='Issued' && tcIsOverdue(req)) return 'Pending for removal';
  return req.status;
}
function tcStatusPill(status){
  const cls = status==='Issued' ? 'status-ok'
    : status==='Rejected' ? 'status-danger'
    : status==='Closed' ? 'status-none'
    : status==='Pending for removal' ? 'status-warn-30'
    : 'status-warn-30'; // Pending
  return el('span', {class:'pill '+cls}, [status]);
}
function tcNextSlNo(){
  const n = STATE.tempConnections.filter(r=>r.slNo).length + 1;
  return 'TC-' + String(n).padStart(4,'0');
}

route('/temp-connection', ()=>{
  const locInput = el('input', {placeholder:'e.g. Unit-3 Boiler platform, Bay 4'});
  const fromInput = el('input', {type:'date'});
  const toInput = el('input', {type:'date'});
  const reqInput = el('textarea', {rows:'2', placeholder:'e.g. 2 x 500W flood lights, 5 HP pump'});
  const nameInput = el('input', {});
  const designationInput = el('input', {});
  const empNoInput = el('input', {});
  const deptSelect = el('select', {}, [el('option',{value:''},['Select department…']), ...TC_DEPARTMENTS.map(d=>el('option',{value:d},[d]))]);
  const forwardingInput = el('input', {});
  const otherInput = el('input', {placeholder:'If Other — specify', style:'display:none; margin-top:.5rem;'});
  const declareChk = el('input', {type:'checkbox'});
  const errBox = el('div', {class:'text-sm', style:'color:var(--red); display:none;'});

  // Clears the red "missing" highlight on a field as soon as the user interacts with it,
  // rather than making them re-submit before the highlight goes away.
  function clearInvalid(node){ return ()=> node.classList.remove('field-invalid'); }
  [locInput, fromInput, toInput, nameInput, designationInput, empNoInput, deptSelect, forwardingInput].forEach(node=>{
    node.addEventListener('input', clearInvalid(node));
    node.addEventListener('change', clearInvalid(node));
  });

  let supplyType = '';
  const supplyGroup = el('div', {class:'flex gap-2'});
  const supplyBtns = ['1 Phase','3 Phase'].map(s=>{
    const b = el('button', {type:'button', class:'btn btn-ghost', onclick:()=>{
      supplyType = s;
      supplyBtns.forEach(x=>{ x.style.borderColor=''; x.style.background=''; x.style.color=''; });
      b.style.borderColor='#0c4fc0'; b.style.background='var(--sky-l)'; b.style.color='#0c4fc0';
      supplyGroup.classList.remove('field-invalid-group');
    }}, [s]);
    return b;
  });
  supplyBtns.forEach(b=> supplyGroup.appendChild(b));

  const purposeChecks = {};
  const purposeRow = el('div', {class:'flex flex-wrap gap-2'});
  TC_PURPOSES.forEach(p=>{
    const cb = el('input', {type:'checkbox', value:p});
    purposeChecks[p] = cb;
    const label = el('label', {class:'btn btn-ghost', style:'cursor:pointer;'}, [cb, el('span',{style:'margin-left:.4rem;'},[p])]);
    cb.addEventListener('change', ()=>{
      label.style.borderColor = cb.checked ? '#0c4fc0' : '';
      label.style.background = cb.checked ? 'var(--sky-l)' : '';
      otherInput.style.display = purposeChecks['Other'].checked ? 'block' : 'none';
      if(TC_PURPOSES.some(pp=>purposeChecks[pp].checked)) purposeRow.classList.remove('field-invalid-group');
    });
    purposeRow.appendChild(label);
  });

  const declareLabel = el('label', {style:'display:flex; align-items:center; gap:.5rem; font-size:.875rem;'}, [declareChk, 'I/We agree to the declaration above *']);
  declareChk.addEventListener('change', ()=>{ if(declareChk.checked) declareLabel.classList.remove('field-invalid-group'); });

  function resetForm(){
    [locInput, fromInput, toInput, reqInput, nameInput, designationInput, empNoInput, forwardingInput, otherInput].forEach(n=> n.value = '');
    deptSelect.value = '';
    declareChk.checked = false;
    supplyType = '';
    supplyBtns.forEach(x=>{ x.style.borderColor=''; x.style.background=''; x.style.color=''; });
    TC_PURPOSES.forEach(p=>{
      purposeChecks[p].checked = false;
      purposeChecks[p].dispatchEvent(new Event('change'));
    });
    otherInput.style.display = 'none';
    [locInput, fromInput, toInput, nameInput, designationInput, empNoInput, deptSelect, forwardingInput].forEach(n=> n.classList.remove('field-invalid'));
    supplyGroup.classList.remove('field-invalid-group');
    purposeRow.classList.remove('field-invalid-group');
    declareLabel.classList.remove('field-invalid-group');
    errBox.style.display = 'none';
  }

  function submitRequest(){
    errBox.style.display = 'none';
    const purposes = TC_PURPOSES.filter(p=>purposeChecks[p].checked);

    // Highlight every missing required field (not just the first one), so the user can
    // see everything that still needs attention in one pass instead of trial-and-error.
    const requiredFields = [
      [locInput, ()=>!locInput.value.trim()],
      [fromInput, ()=>!fromInput.value],
      [toInput, ()=>!toInput.value],
      [nameInput, ()=>!nameInput.value.trim()],
      [designationInput, ()=>!designationInput.value.trim()],
      [empNoInput, ()=>!empNoInput.value.trim()],
      [deptSelect, ()=>!deptSelect.value],
      [forwardingInput, ()=>!forwardingInput.value.trim()]
    ];
    let firstInvalid = null;
    requiredFields.forEach(([node, isMissing])=>{
      if(isMissing()){ node.classList.add('field-invalid'); if(!firstInvalid) firstInvalid = node; }
      else node.classList.remove('field-invalid');
    });
    if(!supplyType){ supplyGroup.classList.add('field-invalid-group'); firstInvalid = firstInvalid || supplyGroup; }
    else supplyGroup.classList.remove('field-invalid-group');
    if(!purposes.length){ purposeRow.classList.add('field-invalid-group'); firstInvalid = firstInvalid || purposeRow; }
    else purposeRow.classList.remove('field-invalid-group');

    if(firstInvalid){
      errBox.textContent = 'Please fill all required fields (marked *) — highlighted below.';
      errBox.style.display = 'block';
      firstInvalid.scrollIntoView({behavior:'smooth', block:'center'});
      if(typeof firstInvalid.focus === 'function') firstInvalid.focus();
      return;
    }
    if(!declareChk.checked){
      declareLabel.classList.add('field-invalid-group');
      errBox.textContent = 'Please agree to the declaration before submitting.'; errBox.style.display='block';
      declareLabel.scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    declareLabel.classList.remove('field-invalid-group');

    const req = {
      id: uid('tc'), location: locInput.value.trim(), supplyType,
      periodFrom: fromInput.value, periodTo: toInput.value,
      purposes, purposeOther: otherInput.value.trim(),
      requirement: reqInput.value.trim(),
      applicantName: nameInput.value.trim(), designation: designationInput.value.trim(),
      empNo: empNoInput.value.trim(), department: deptSelect.value, forwarding: forwardingInput.value.trim(),
      declared: true, status:'Pending', submittedAt: new Date().toISOString(),
      slNo:'', issuedAt:'', technicianName:'', connectionDate:'', checklist:{}, rejectReason:''
    };
    STATE.tempConnections.push(req);
    try{
      saveState();
    }catch(err){
      STATE.tempConnections.pop();
      toast('Something went wrong saving this request (' + (err&&err.message||'unknown error') + '). Nothing was lost from the form — please try again.', {duration:8000});
      return;
    }
    let pdfNote = '';
    try{ downloadPdf(generateTempConnectionPdf(req), `TempConnection_${req.location.replace(/[^a-z0-9]+/gi,'_')}.pdf`); }
    catch(e){ pdfNote = ' PDF generation failed, but the request was saved.'; }
    resetForm();
    toast('Request submitted successfully — now pending EMD review.' + pdfNote, {duration:6000});
  }

  shell(el('div', {}, [
    pageHeader('Temporary Electrical Connection', 'Requisition — to be filled by the applicant. A PDF copy downloads automatically on submission.'),
    el('div', {class:'card p-6 space-y-5 max-w-3xl'}, [
      el('div', {}, [
        el('div', {class:'font-head font-bold mb-3'}, ['Connection details']),
        labeled('Area / location where connection is required *', locInput)
      ]),
      el('div', {class:'row2'}, [
        el('div', {}, [el('label',{class:'field-label'},['Type of supply *']), supplyGroup]),
        el('div', {}, [el('label',{class:'field-label'},['Time period *']), el('div',{class:'flex gap-2 items-center'}, [fromInput, el('span',{class:'text-slate-400 text-sm'},['to']), toInput])])
      ]),
      el('div', {}, [
        el('label',{class:'field-label'},['Purpose of which supply is required *']),
        purposeRow, otherInput
      ]),
      labeled('Please specify requirement (no. of light fittings / pump HP / amps)', reqInput),
      el('div', {style:'border-top:1px solid var(--line)'}),
      el('div', {class:'font-head font-bold'}, ['Applicant details']),
      el('div', {class:'row2'}, [
        labeled('Name of applicant *', nameInput), labeled('Designation *', designationInput)
      ]),
      el('div', {class:'row2'}, [
        labeled('Employee no. *', empNoInput), labeled('Department *', deptSelect)
      ]),
      labeled('Forwarding officer / HOD name *', forwardingInput),
      el('div', {style:'border-top:1px solid var(--line)'}),
      el('div', {class:'font-head font-bold'}, ['Declaration']),
      el('div', {class:'text-sm text-slate-500', style:'background:#f7f7f9; border-radius:.5rem; padding:1rem;'}, [
        el('ul', {style:'margin:0; padding-left:1.1rem; line-height:1.6;'}, [
          el('li',{},['I/We will ensure there is no unauthorised addition or alteration to the temporary supply that could increase load or create an unsafe condition.']),
          el('li',{},['I/We will ensure connected equipment (welding machine, pump, etc.) is healthy and properly earthed.']),
          el('li',{},['I/We will abide by electrical safety rules and ensure safe working on the temporary connection.']),
          el('li',{},['I/We will inform EMD to disconnect immediately after work completion and will not leave the connection unattended.'])
        ])
      ]),
      declareLabel,
      errBox,
      el('div', {}, [el('button', {class:'btn btn-primary', onclick:submitRequest}, ['Submit request'])])
    ])
  ]));
});

  const dueForRemoval = STATE.tempConnections.filter(r=>tcIsOverdue(r)).sort((a,b)=> new Date(a.periodTo)-new Date(b.periodTo));
  const recent = STATE.tempConnections.filter(r=>r.status!=='Pending' && !tcIsOverdue(r)).sort((a,b)=> new Date(b.issuedAt||b.submittedAt)-new Date(a.issuedAt||a.submittedAt)).slice(0,8);

  shell(el('div', {}, [
    pageHeader('Temp. Connection — Approver', pending.length+' request(s) awaiting review'+(dueForRemoval.length?', '+dueForRemoval.length+' pending removal':'')+'.', [

      el('h3', {class:'font-head font-bold mb-3 text-sm text-slate-400 uppercase tracking-wide'}, ['Pending for removal']),
      ...removalCards
    ]) : null,
    el('h3', {class:'font-head font-bold mb-3 text-sm text-slate-400 uppercase tracking-wide'}, ['Awaiting review']),
    ...pendingCards,
    recent.length ? el('div', {class:'mt-8'}, [
      el('h3', {class:'font-head font-bold mb-3 text-sm text-slate-400 uppercase tracking-wide'}, ['Recently decided']),
      el('div', {class:'card overflow-x-auto'}, [gridTable(
        [{label:'Location',width:'26%'},{label:'Applicant',width:'22%'},{label:'SL No.',width:'14%'},{label:'Status',width:'18%'},{label:'Date',width:'20%'}],

    decisionBlock = el('div', {class:'card p-5 mt-4', style:'border-color:var(--amber);'}, [
      el('div', {class:'font-head font-bold mb-2'}, ['Removal']),
      tcStatusPill('Pending for removal'),
      el('p', {class:'text-sm mt-2'}, [el('b',{},['SL No.: ']), req.slNo||'—', '   ', el('b',{},['Valid up to: ']), fmtDate(req.periodTo)]),

      el('div', {class:'mt-4'}, [
        el('button', {class:'btn btn-primary', onclick:confirmRemovalHere}, ['Confirm removal'])
      ])
    ]);
  } else if(req.status==='Pending'){
    const toggles = {};
    const toggleRows = TC_CHECKLIST_ITEMS.map(c=>{
      const sw = el('button', {type:'button', class:'btn btn-ghost', style:'padding:.3rem .8rem;', onclick:()=>{
        toggles[c.key] = !toggles[c.key];
        sw.textContent = toggles[c.key] ? 'Yes' : 'No';
        sw.style.background = toggles[c.key] ? 'var(--green-l)' : '';
        sw.style.color = toggles[c.key] ? 'var(--green)' : '';
      }}, ['No']);

    function issue(){
      req.checklist = {...toggles};
      req.slNo = slInput.value.trim() || tcNextSlNo();
      req.technicianName = techInput.value.trim();
      req.connectionDate = dateInput.value;
      req.status = 'Issued';
      req.issuedAt = new Date().toISOString();
      saveState();
      toast('Connection issued.');
      navigate('/temp-connection/approve');
    }
    function reject(){
      const reason = prompt('Reason for rejection (optional):') || '';
      req.status = 'Rejected'; req.rejectReason = reason; req.issuedAt = new Date().toISOString();
      saveState();
      toast('Request rejected.');
      navigate('/temp-connection/approve');
    }

    decisionBlock = el('div', {class:'card p-5 mt-4'}, [
      el('div', {class:'font-head font-bold mb-2'}, ['Safety checklist']),
      ...toggleRows,
      el('div', {class:'grid sm:grid-cols-2 gap-4 mt-4'}, [
        labeled('SL No. of temp. connection register', slInput),
        labeled('Technician name', techInput)
      ]),
      labeled('Connection date', dateInput),
      errBox,
      el('div', {class:'flex gap-2 mt-4'}, [
        el('button', {class:'btn btn-primary', onclick:issue}, ['Issue connection']),
        el('button', {class:'btn btn-danger', onclick:reject}, ['Reject'])
      ])
    ]);
  } else {
    decisionBlock = el('div', {class:'card p-5 mt-4'}, [
      el('div', {class:'font-head font-bold mb-2'}, ['Decision']),
      tcStatusPill(tcDisplayStatus(req)),
      (req.status==='Issued' || req.status==='Closed')
        ? el('p', {class:'text-sm mt-2'}, [el('b',{},['SL No.: ']), req.slNo||'—', '   ', el('b',{},['Technician: ']), req.technicianName||'—', '   ', el('b',{},['Connection date: ']), fmtDate(req.connectionDate)])
        : (req.rejectReason ? el('p', {class:'text-sm mt-2'}, [el('b',{},['Reason: ']), req.rejectReason]) : null),
      req.status==='Closed'
        ? el('p', {class:'text-sm mt-2 text-slate-500'}, [el('b',{},['Removed: ']), fmtDate(req.removedAt)])
        : null
    ]);
  }

  shell(el('div', {}, [
    el('a', {href:'#/temp-connection/approve', class:'btn btn-ghost mb-4'}, ['← Back to list']),
    summary,
    decisionBlock
  ]));
});
